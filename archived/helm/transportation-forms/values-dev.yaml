namespace: transportation-forms-dev

image:
  repository: image-registry.openshift-image-registry.svc:5000/transportation-forms-dev/transportation-forms-app
  tag: dev-latest
  pullPolicy: IfNotPresent

app:
  environment: development

# Enable bundled PostgreSQL in DEV namespace.
# Production uses an external managed database (postgres.enabled: false).
postgres:
  enabled: true
  secretName: transportation-forms-secrets

frontend:
  backendUrl: http://transportation-forms-app:8000
