services:
  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transportation-forms-app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://transportation:password@db:5432/transportation_forms
      - SQLALCHEMY_ECHO=true
      - LOG_LEVEL=INFO
      # CORS - comma-separated list of allowed origins
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8000
      # MinIO (local file storage)
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=form-attachments
      - MINIO_PUBLIC_URL=http://localhost:9000
    volumes:
      - ./backend:/app/backend
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    command: sh /app/entrypoint.sh

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transportation-forms-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - app
    restart: unless-stopped
    command: python -m uvicorn frontend.app:app --host 0.0.0.0 --port 3000

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: transportation-forms-db
    environment:
      POSTGRES_USER: transportation
      POSTGRES_PASSWORD: password
      POSTGRES_DB: transportation_forms
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C -c password_encryption=md5"
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Removed problematic pg_hba.conf mount - PostgreSQL will use defaults
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transportation -d transportation_forms"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO - S3-compatible local file storage (TASK-110C)
  minio:
    image: minio/minio:latest
    container_name: transportation-forms-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console (admin UI)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
