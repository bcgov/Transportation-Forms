name: Deployer (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment name (dev / test / prod / PR number)"
        required: true
        type: string
      backend_tag:
        description: "Image tag for the backend container"
        required: false
        type: string
        default: latest
      backend_digest:
        description: "Optional immutable digest for the backend container"
        required: false
        type: string
        default: ""
      migrations_tag:
        description: "Image tag for the migrations init container"
        required: false
        type: string
        default: latest
      migrations_digest:
        description: "Optional immutable digest for the migrations init container"
        required: false
        type: string
        default: ""
      frontend_tag:
        description: "Image tag for the frontend container"
        required: false
        type: string
        default: latest
      frontend_digest:
        description: "Optional immutable digest for the frontend container"
        required: false
        type: string
        default: ""
      public_backend_tag:
        description: "Image tag for the public-backend container"
        required: false
        type: string
        default: latest
      public_backend_digest:
        description: "Optional immutable digest for the public-backend container"
        required: false
        type: string
        default: ""
      public_frontend_tag:
        description: "Image tag for the public-frontend container"
        required: false
        type: string
        default: latest
      public_frontend_digest:
        description: "Optional immutable digest for the public-frontend container"
        required: false
        type: string
        default: ""
      params:
        description: "Extra helm --set parameters (space-separated key=value pairs)"
        required: false
        type: string
        default: ""
      triggers:
        description: "Comma-separated list of paths; deploy only when changed"
        required: false
        type: string
        default: ""
      db_triggers:
        description: "Comma-separated list of paths that trigger a Crunchy DB update"
        required: false
        type: string
        default: ""
      db_user:
        description: "PostgreSQL application user managed by Crunchy"
        required: false
        type: string
        default: app
      public_forms_base_url:
        description: "Externally visible base URL for public-frontend and public-backend routes (e.g. https://forms-public-{release}.{domain})"
        required: false
        type: string
        default: ""
    outputs:
      tag:
        description: "Image tag that was deployed"
        value: ${{ jobs.deploy.outputs.tag }}
      triggered:
        description: "Whether a deployment was actually performed"
        value: ${{ jobs.deploy.outputs.triggered }}
    secrets:
      oc_token:
        required: true
      database_url:
        required: true
      secret_key:
        required: true
      jwt_private_key_pem:
        required: true
      jwt_public_key_pem:
        required: true
      s3_endpoint_url:
        required: true
      s3_access_key:
        required: true
      s3_secret_key:
        required: true
      s3_bucket:
        required: true
      keycloak_server_url:
        required: true
      keycloak_realm:
        required: true
      keycloak_client_id:
        required: true
      keycloak_client_secret:
        required: true
      keycloak_redirect_uri:
        required: true
      initial_admin_email:
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    environment:
      name: ${{ inputs.environment }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      triggered: ${{ steps.meta.outputs.triggered }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Resolve deployment metadata
        id: meta
        shell: bash
        run: |
          echo "tag=${{ inputs.backend_tag }}" >> "$GITHUB_OUTPUT"
          echo "triggered=true"       >> "$GITHUB_OUTPUT"

      # ── Deploy Crunchy PostgreSQL ─────────────────────────────────────────
      - name: Deploy Crunchy PostgreSQL
        uses: bcgov/action-crunchy@v2.1.0
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.OC_SERVER }}
          environment: ${{ inputs.environment }}
          values_file: >-
            ${{
              inputs.environment == 'prod' && 'infra/charts/crunchy/values-prod.yml' ||
              inputs.environment == 'test' && 'infra/charts/crunchy/values-test.yml' ||
              'infra/charts/crunchy/values.yml'
            }}
          s3_access_key: ${{ secrets.s3_access_key }}
          s3_secret_key: ${{ secrets.s3_secret_key }}
          s3_bucket: ${{ secrets.s3_bucket }}
          s3_endpoint: ${{ secrets.s3_endpoint_url }}

      # ── Deploy application via Helm ───────────────────────────────────────
      - name: Update Helm dependencies
        uses: bcgov/action-oc-runner@v1.4.1
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.OC_SERVER }}
          commands: |
            helm dependency update infra/charts/app

      - name: Helm upgrade / install
        uses: bcgov/action-oc-runner@v1.4.1
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.OC_SERVER }}
          commands: |
            set -euo pipefail
            helm dependency update infra/charts/app
            RELEASE_NAME="transportation-forms-${{ inputs.environment }}"
            CHART="infra/charts/app"
            BACKEND_TAG="${{ inputs.backend_tag }}"
            MIGRATIONS_TAG="${{ inputs.migrations_tag }}"
            FRONTEND_TAG="${{ inputs.frontend_tag }}"
            PUBLIC_BACKEND_TAG="${{ inputs.public_backend_tag }}"
            PUBLIC_FRONTEND_TAG="${{ inputs.public_frontend_tag }}"
            ENV="${{ inputs.environment }}"
            TARGET_DOMAIN="${{ vars.TARGET_ENV_DOMAIN || 'apps.silver.devops.gov.bc.ca' }}"
            FRONTEND_BASE_URL="https://frontend-${RELEASE_NAME}.${TARGET_DOMAIN}"
            PUBLIC_FORMS_BASE_URL="${{ inputs.public_forms_base_url }}"
            if [[ -z "${PUBLIC_FORMS_BASE_URL}" ]]; then
              PUBLIC_FORMS_BASE_URL="https://forms-public-${RELEASE_NAME}.${TARGET_DOMAIN}"
            fi
            JWT_PRIVATE_KEY_FILE="$(mktemp)"
            JWT_PUBLIC_KEY_FILE="$(mktemp)"
            trap 'rm -f "${JWT_PRIVATE_KEY_FILE}" "${JWT_PUBLIC_KEY_FILE}"' EXIT
            cat > "${JWT_PRIVATE_KEY_FILE}" <<'JWT_PRIVATE_KEY_EOF'
            ${{ secrets.jwt_private_key_pem }}
            JWT_PRIVATE_KEY_EOF
            cat > "${JWT_PUBLIC_KEY_FILE}" <<'JWT_PUBLIC_KEY_EOF'
            ${{ secrets.jwt_public_key_pem }}
            JWT_PUBLIC_KEY_EOF

            # Determine values file override (test/prod have specific files)
            VALUES_OVERRIDE=""
            if [[ "$ENV" == "test" ]]; then
              VALUES_OVERRIDE="-f ${CHART}/values-test.yaml"
            elif [[ "$ENV" == "prod" ]]; then
              VALUES_OVERRIDE="-f ${CHART}/values-prod.yaml"
            fi

            # Clean slashes from S3 parameters to prevent signing/routing errors on OpenShift
            S3_ENDPOINT="${{ secrets.s3_endpoint_url }}"
            S3_BUCKET="${{ secrets.s3_bucket }}"
            S3_ENDPOINT_CLEAN="${S3_ENDPOINT%/}"
            S3_BUCKET_CLEAN="${S3_BUCKET#/}"
            S3_BUCKET_CLEAN="${S3_BUCKET_CLEAN%/}"
            S3_UPSTREAM="${S3_ENDPOINT_CLEAN}/${S3_BUCKET_CLEAN}"

            helm upgrade --install "${RELEASE_NAME}" "${CHART}" \
              --namespace "${{ vars.OC_NAMESPACE }}" \
              -f "${CHART}/values.yaml" \
              ${VALUES_OVERRIDE} \
              --set-string backend.image.tag="${BACKEND_TAG}" \
              --set-string backend.image.digest="${{ inputs.backend_digest }}" \
              --set-string backend.image.migrationsTag="${MIGRATIONS_TAG}" \
              --set-string backend.image.migrationsDigest="${{ inputs.migrations_digest }}" \
              --set-string frontend.image.tag="${FRONTEND_TAG}" \
              --set-string frontend.image.digest="${{ inputs.frontend_digest }}" \
              --set-string public-backend.image.tag="${PUBLIC_BACKEND_TAG}" \
              --set-string public-backend.image.digest="${{ inputs.public_backend_digest }}" \
              --set-string public-frontend.image.tag="${PUBLIC_FRONTEND_TAG}" \
              --set-string public-frontend.image.digest="${{ inputs.public_frontend_digest }}" \
              --set-string global.registry=ghcr.io \
              --set-string global.repository=bcgov/transportation-forms \
              --set-string backend.secrets.databaseUrl="${{ secrets.database_url }}" \
              --set-string backend.secrets.secretKey="${{ secrets.secret_key }}" \
              --set-file backend.secrets.jwtPrivateKeyPem="${JWT_PRIVATE_KEY_FILE}" \
              --set-file backend.secrets.jwtPublicKeyPem="${JWT_PUBLIC_KEY_FILE}" \
              --set-string backend.secrets.s3EndpointUrl="${S3_ENDPOINT_CLEAN}" \
              --set-string backend.secrets.s3AccessKey="${{ secrets.s3_access_key }}" \
              --set-string backend.secrets.s3SecretKey="${{ secrets.s3_secret_key }}" \
              --set-string backend.secrets.s3Bucket="${S3_BUCKET_CLEAN}" \
              --set-string backend.secrets.keycloakServerUrl="${{ secrets.keycloak_server_url }}" \
              --set-string backend.secrets.keycloakRealm="${{ secrets.keycloak_realm }}" \
              --set-string backend.secrets.keycloakClientId="${{ secrets.keycloak_client_id }}" \
              --set-string backend.secrets.keycloakClientSecret="${{ secrets.keycloak_client_secret }}" \
              --set-string backend.secrets.keycloakRedirectUri="${{ secrets.keycloak_redirect_uri }}" \
              --set-string backend.secrets.initialAdminEmail="${{ secrets.initial_admin_email }}" \
              --set-string backend.env.corsOrigins="${FRONTEND_BASE_URL}" \
              --set-string public-backend.env.publicCorsOrigins="${PUBLIC_FORMS_BASE_URL}" \
              --set-string "public-frontend.s3.internalUpstream=${S3_UPSTREAM}" \
              --set-string "public-frontend.publicBaseUrl=${PUBLIC_FORMS_BASE_URL}" \
              --set-string "public-backend.publicBaseUrl=${PUBLIC_FORMS_BASE_URL}" \
              ${{ inputs.params }} \
              --timeout 10m \
              --wait \
              --atomic