name: Deployer (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment name (dev / test / prod / PR number)"
        required: true
        type: string
      backend_tag:
        description: "Image tag for the backend container"
        required: false
        type: string
        default: latest
      backend_digest:
        description: "Optional immutable digest for the backend container"
        required: false
        type: string
        default: ""
      migrations_tag:
        description: "Image tag for the migrations init container"
        required: false
        type: string
        default: latest
      migrations_digest:
        description: "Optional immutable digest for the migrations init container"
        required: false
        type: string
        default: ""
      frontend_tag:
        description: "Image tag for the frontend container"
        required: false
        type: string
        default: latest
      frontend_digest:
        description: "Optional immutable digest for the frontend container"
        required: false
        type: string
        default: ""
      public_backend_tag:
        description: "Image tag for the public-backend container"
        required: false
        type: string
        default: latest
      public_backend_digest:
        description: "Optional immutable digest for the public-backend container"
        required: false
        type: string
        default: ""
      public_frontend_tag:
        description: "Image tag for the public-frontend container"
        required: false
        type: string
        default: latest
      public_frontend_digest:
        description: "Optional immutable digest for the public-frontend container"
        required: false
        type: string
        default: ""
      params:
        description: "Extra helm --set parameters (space-separated key=value pairs)"
        required: false
        type: string
        default: ""
      triggers:
        description: "Comma-separated list of paths; deploy only when changed"
        required: false
        type: string
        default: ""
      db_triggers:
        description: "Comma-separated list of paths that trigger a Crunchy DB update"
        required: false
        type: string
        default: ""
      db_user:
        description: "PostgreSQL application user managed by Crunchy"
        required: false
        type: string
        default: app
      public_forms_base_url:
        description: "Externally visible base URL for public-frontend and public-backend routes (e.g. https://forms-public-{release}.{domain})"
        required: false
        type: string
        default: ""
    outputs:
      tag:
        description: "Image tag that was deployed"
        value: ${{ jobs.deploy.outputs.tag }}
      triggered:
        description: "Whether a deployment was actually performed"
        value: ${{ jobs.deploy.outputs.triggered }}
    secrets:
      oc_token:
        required: true
      s3_endpoint_url:
        required: true
      s3_access_key:
        required: true
      s3_secret_key:
        required: true
      s3_bucket:
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    environment:
      name: ${{ inputs.environment }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      triggered: ${{ steps.meta.outputs.triggered }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Resolve deployment metadata
        id: meta
        shell: bash
        run: |
          echo "tag=${{ inputs.backend_tag }}" >> "$GITHUB_OUTPUT"
          echo "triggered=true"       >> "$GITHUB_OUTPUT"

   #   - name: Verify predefined analytics password
   #     uses: bcgov/action-oc-runner@v1.4.1
   #     with:
   #       oc_namespace: ${{ vars.LICENSE_PLATE }}-${{ inputs.environment }}
   #       oc_token: ${{ secrets.oc_token }}
   #       oc_server: ${{ vars.OC_SERVER }}
   #       commands: |
   #         set -euo pipefail
   #         MATCHES="$(oc get secret -l 'postgres-operator.crunchydata.com/pguser=analytics-count-login' -o name)"
   #         if [[ -z "${MATCHES}" || "${MATCHES}" == *$'\n'* ]]; then
   #           echo "Expected exactly one pre-provisioned analytics login Secret." >&2
   #           exit 1
   #         fi
   #         SECRET_NAME="${MATCHES#secret/}"
   #         if [[ "${SECRET_NAME}" != *-pguser-analytics-count-login ||
   #               -z "$(oc get secret "${SECRET_NAME}" -o jsonpath='{.data.password}')" ]]; then
   #           echo "The pre-provisioned analytics login Secret needs a password." >&2
   #           exit 1
   #         fi

      # ── Deploy Crunchy PostgreSQL ─────────────────────────────────────────
      - name: Deploy Crunchy PostgreSQL
        id: crunchy
        uses: bcgov/action-crunchy@v2.1.0
        with:
          oc_namespace: ${{ vars.LICENSE_PLATE }}-${{ inputs.environment }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.OC_SERVER }}
          environment: ${{ inputs.environment }}
          values_file: infra/charts/crunchy/values.yml
          s3_access_key: ${{ secrets.s3_access_key }}
          s3_secret_key: ${{ secrets.s3_secret_key }}
          s3_bucket: ${{ secrets.s3_bucket }}
          s3_endpoint: ${{ secrets.s3_endpoint_url }}

      - name: Configure application database schema
        uses: bcgov/action-oc-runner@v1.4.1
        with:
          oc_namespace: ${{ vars.LICENSE_PLATE }}-${{ inputs.environment }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.OC_SERVER }}
          commands: |
            set -euo pipefail
            CLUSTER="${{ steps.crunchy.outputs.cluster }}"
            DATABASE="transportation_forms"
            DATABASE_USER="${{ inputs.db_user }}"
            READONLY_USER="publicreadonly"
            ANALYTICS_USER="analytics-count-login"
            ANALYTICS_SECRET="${CLUSTER}-pguser-${ANALYTICS_USER}"
            if [[ "$(oc get secret -l "postgres-operator.crunchydata.com/cluster=${CLUSTER},postgres-operator.crunchydata.com/pguser=${ANALYTICS_USER}" -o name)" != "secret/${ANALYTICS_SECRET}" ]]; then
              echo "Pre-provisioned analytics Secret does not match the deployed cluster." >&2
              exit 1
            fi
            PRIMARY_POD="$(oc get pods \
              -l "postgres-operator.crunchydata.com/cluster=${CLUSTER},postgres-operator.crunchydata.com/role=master" \
              -o jsonpath='{.items[0].metadata.name}')"

            if oc exec "${PRIMARY_POD}" -c database -- \
              psql -U postgres -d "${DATABASE}" -Atqc \
              "SELECT to_regclass('public.alembic_version') IS NOT NULL" | grep -qx t; then
              echo "Existing public-schema database detected; preserving its search path."
            else
              echo "New database detected; using the public schema."
            fi

            oc exec "${PRIMARY_POD}" -c database -- \
              psql -U postgres -d "${DATABASE}" -v ON_ERROR_STOP=1 \
              -c "ALTER ROLE \"${DATABASE_USER}\" IN DATABASE \"${DATABASE}\" SET search_path TO public; \
                  GRANT USAGE ON SCHEMA public TO \"${DATABASE_USER}\" WITH GRANT OPTION; \
                  GRANT CREATE ON SCHEMA public TO \"${DATABASE_USER}\""

            for ATTEMPT in $(seq 1 30); do
              if oc exec "${PRIMARY_POD}" -c database -- \
                psql -U postgres -d "${DATABASE}" -Atqc \
                "SELECT 1 FROM pg_roles WHERE rolname = '${READONLY_USER}'" | grep -qx 1; then
                break
              fi

              if [[ "${ATTEMPT}" -eq 30 ]]; then
                echo "Crunchy did not create role ${READONLY_USER}." >&2
                exit 1
              fi
              echo "Waiting for read-only database role (${ATTEMPT}/30)..."
              sleep 2
            done

            oc exec "${PRIMARY_POD}" -c database -- \
              psql -U postgres -d "${DATABASE}" -v ON_ERROR_STOP=1 \
              -c "ALTER ROLE \"${READONLY_USER}\" IN DATABASE \"${DATABASE}\" SET search_path TO public; \
                  GRANT CONNECT ON DATABASE \"${DATABASE}\" TO \"${READONLY_USER}\"; \
                  GRANT USAGE ON SCHEMA public TO \"${READONLY_USER}\"; \
                  REVOKE CREATE ON SCHEMA public FROM \"${READONLY_USER}\"; \
                  GRANT SELECT ON ALL TABLES IN SCHEMA public TO \"${READONLY_USER}\"; \
                  REVOKE INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON ALL TABLES IN SCHEMA public FROM \"${READONLY_USER}\"; \
                  ALTER DEFAULT PRIVILEGES FOR ROLE \"${DATABASE_USER}\" IN SCHEMA public GRANT SELECT ON TABLES TO \"${READONLY_USER}\";"

            for ATTEMPT in $(seq 1 30); do
              if oc exec "${PRIMARY_POD}" -c database -- \
                psql -U postgres -d "${DATABASE}" -Atqc \
                "SELECT 1 FROM pg_roles WHERE rolname = '${ANALYTICS_USER}'" | grep -qx 1 &&
                [[ -n "$(oc get secret "${ANALYTICS_SECRET}" -o jsonpath='{.data.password}' 2>/dev/null)" ]] &&
                [[ -n "$(oc get secret "${ANALYTICS_SECRET}" -o jsonpath='{.data.uri}' 2>/dev/null)" ]]; then
                break
              fi

              if [[ "${ATTEMPT}" -eq 30 ]]; then
                echo "Crunchy did not provision the analytics login and connection Secret." >&2
                exit 1
              fi
              echo "Waiting for analytics database login and Secret (${ATTEMPT}/30)..."
              sleep 2
            done

            # Migration 026 creates this role if needed and owns its table grants.
            # Pre-create it here so membership is ready before the migrated pods start.
            oc exec -i "${PRIMARY_POD}" -c database -- \
              psql -U postgres -d "${DATABASE}" -v ON_ERROR_STOP=1 <<'SQL'
            DO $role$
            BEGIN
                IF NOT EXISTS (
                    SELECT 1 FROM pg_roles WHERE rolname = 'daily_engagement_writer'
                ) THEN
                    CREATE ROLE daily_engagement_writer
                        NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE
                        NOREPLICATION NOBYPASSRLS;
                END IF;

                IF NOT EXISTS (
                    SELECT 1 FROM pg_roles
                    WHERE rolname = 'daily_engagement_writer'
                      AND NOT rolcanlogin AND NOT rolinherit AND NOT rolsuper
                      AND NOT rolcreatedb AND NOT rolcreaterole
                      AND NOT rolreplication AND NOT rolbypassrls
                ) OR EXISTS (
                    SELECT 1 FROM pg_auth_members AS membership
                    JOIN pg_roles AS writer ON writer.oid = membership.member
                    WHERE writer.rolname = 'daily_engagement_writer'
                ) THEN
                    RAISE EXCEPTION 'Unsafe daily_engagement_writer role';
                END IF;

                IF NOT EXISTS (
                    SELECT 1 FROM pg_roles
                    WHERE rolname = 'analytics-count-login'
                      AND rolcanlogin AND rolinherit AND NOT rolsuper
                      AND NOT rolcreatedb AND NOT rolcreaterole
                      AND NOT rolreplication AND NOT rolbypassrls
                ) OR EXISTS (
                    SELECT 1 FROM pg_database
                    WHERE datname = current_database()
                      AND datdba = '"analytics-count-login"'::regrole
                ) OR EXISTS (
                    SELECT 1 FROM pg_auth_members AS membership
                    JOIN pg_roles AS login ON login.oid = membership.member
                    JOIN pg_roles AS parent ON parent.oid = membership.roleid
                    WHERE login.rolname = 'analytics-count-login'
                      AND parent.rolname <> 'daily_engagement_writer'
                ) THEN
                    RAISE EXCEPTION 'Unsafe analytics-count-login account';
                END IF;
            END
            $role$;

            REVOKE ALL ON DATABASE transportation_forms FROM "analytics-count-login";
            GRANT CONNECT ON DATABASE transportation_forms TO "analytics-count-login";
            REVOKE ALL ON SCHEMA public FROM "analytics-count-login";
            GRANT daily_engagement_writer TO "analytics-count-login"
                WITH INHERIT TRUE, SET FALSE;
            SQL

      # ── Deploy application via Helm ───────────────────────────────────────
      - name: Update Helm dependencies
        uses: bcgov/action-oc-runner@v1.4.1
        with:
          oc_namespace: ${{ vars.LICENSE_PLATE }}-${{ inputs.environment }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.OC_SERVER }}
          commands: |
            helm dependency update infra/charts/app

      - name: Helm upgrade / install
        uses: bcgov/action-oc-runner@v1.4.1
        with:
          oc_namespace: ${{ vars.LICENSE_PLATE }}-${{ inputs.environment }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.OC_SERVER }}
          commands: |
            set -euo pipefail
            helm dependency update infra/charts/app
            RELEASE_NAME="transportation-forms-${{ inputs.environment }}"
            CHART="infra/charts/app"
            BACKEND_TAG="${{ inputs.backend_tag }}"
            MIGRATIONS_TAG="${{ inputs.migrations_tag }}"
            FRONTEND_TAG="${{ inputs.frontend_tag }}"
            PUBLIC_BACKEND_TAG="${{ inputs.public_backend_tag }}"
            PUBLIC_FRONTEND_TAG="${{ inputs.public_frontend_tag }}"
            ENV="${{ inputs.environment }}"
            TARGET_DOMAIN="${{ vars.TARGET_ENV_DOMAIN || 'apps.silver.devops.gov.bc.ca' }}"
            FRONTEND_HOST="frontend-${RELEASE_NAME}.${TARGET_DOMAIN}"
            if [[ "${ENV}" == "test" ]]; then
              FRONTEND_HOST="staff-${RELEASE_NAME}.${TARGET_DOMAIN}"
            fi
            FRONTEND_BASE_URL="https://${FRONTEND_HOST}"
            PUBLIC_FORMS_BASE_URL="${{ inputs.public_forms_base_url }}"
            if [[ -z "${PUBLIC_FORMS_BASE_URL}" ]]; then
              PUBLIC_FORMS_BASE_URL="https://forms-public-${RELEASE_NAME}.${TARGET_DOMAIN}"
            fi

            CLUSTER="${{ steps.crunchy.outputs.cluster }}"
            LICENSE_PLATE="${{ vars.LICENSE_PLATE }}"
            OC_NAMESPACE="${LICENSE_PLATE}-${ENV}"
            if [[ "${ENV}" == "prod" ]]; then
              VAULT_ROLE="${LICENSE_PLATE}-prod"
            else
              VAULT_ROLE="${LICENSE_PLATE}-nonprod"
            fi
            VAULT_KSA="${LICENSE_PLATE}-vault"
            if [[ -z "${CLUSTER}" || -z "${LICENSE_PLATE}" ]]; then
              echo "Crunchy cluster and LICENSE_PLATE are required." >&2
              exit 1
            fi

            # Determine values file override (test/prod have specific files)
            VALUES_OVERRIDE=""
            if [[ "$ENV" == "test" ]]; then
              VALUES_OVERRIDE="-f ${CHART}/values-test.yaml"
            elif [[ "$ENV" == "prod" ]]; then
              VALUES_OVERRIDE="-f ${CHART}/values-prod.yaml"
            fi

            helm upgrade --install "${RELEASE_NAME}" "${CHART}" \
              --namespace "${OC_NAMESPACE}" \
              -f "${CHART}/values.yaml" \
              ${VALUES_OVERRIDE} \
              --set-string backend.image.tag="${BACKEND_TAG}" \
              --set-string backend.image.digest="${{ inputs.backend_digest }}" \
              --set-string backend.image.migrationsTag="${MIGRATIONS_TAG}" \
              --set-string backend.image.migrationsDigest="${{ inputs.migrations_digest }}" \
              --set-string frontend.image.tag="${FRONTEND_TAG}" \
              --set-string frontend.image.digest="${{ inputs.frontend_digest }}" \
              --set-string frontend.routes.host="${FRONTEND_HOST}" \
              --set-string public-backend.image.tag="${PUBLIC_BACKEND_TAG}" \
              --set-string public-backend.image.digest="${{ inputs.public_backend_digest }}" \
              --set-string public-frontend.image.tag="${PUBLIC_FRONTEND_TAG}" \
              --set-string public-frontend.image.digest="${{ inputs.public_frontend_digest }}" \
              --set-string global.registry=ghcr.io \
              --set-string global.repository=bcgov/transportation-forms \
              --set-string backend.env.corsOrigins="${FRONTEND_BASE_URL}" \
              --set-string backend.env.staffEngagementOrigin="${FRONTEND_BASE_URL}" \
              --set-string public-backend.env.publicCorsOrigins="${PUBLIC_FORMS_BASE_URL}" \
              --set-string global.crunchyCluster="${CLUSTER}" \
              --set-string backend.deployment.vault.enabled=true \
              --set-string backend.deployment.vault.role="${VAULT_ROLE}" \
              --set-string backend.deployment.vault.path="${ENV}/internal" \
              --set-string backend.deployment.vault.serviceAccountName="${VAULT_KSA}" \
              --set-string public-backend.deployment.vault.enabled=true \
              --set-string public-backend.deployment.vault.role="${VAULT_ROLE}" \
              --set-string public-backend.deployment.vault.path="${ENV}/public" \
              --set-string public-backend.deployment.vault.serviceAccountName="${VAULT_KSA}" \
              --set-string public-frontend.deployment.vault.enabled=true \
              --set-string public-frontend.deployment.vault.role="${VAULT_ROLE}" \
              --set-string public-frontend.deployment.vault.path="${ENV}/public" \
              --set-string public-frontend.deployment.vault.serviceAccountName="${VAULT_KSA}" \
              --set-string "public-frontend.publicBaseUrl=${PUBLIC_FORMS_BASE_URL}" \
              --set-string "public-backend.publicBaseUrl=${PUBLIC_FORMS_BASE_URL}" \
              ${{ inputs.params }} \
              --timeout 10m \
              --wait \
              --atomic
