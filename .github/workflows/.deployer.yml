name: Deployer (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment name (dev / test / prod / PR number)"
        required: true
        type: string
      tag:
        description: "Image tag to deploy"
        required: true
        type: string
      params:
        description: "Extra helm --set parameters (space-separated key=value pairs)"
        required: false
        type: string
        default: ""
      triggers:
        description: "Comma-separated list of paths; deploy only when changed"
        required: false
        type: string
        default: ""
      db_triggers:
        description: "Comma-separated list of paths that trigger a Crunchy DB update"
        required: false
        type: string
        default: ""
      db_user:
        description: "PostgreSQL application user managed by Crunchy"
        required: false
        type: string
        default: app
    outputs:
      tag:
        description: "Image tag that was deployed"
        value: ${{ jobs.deploy.outputs.tag }}
      triggered:
        description: "Whether a deployment was actually performed"
        value: ${{ jobs.deploy.outputs.triggered }}
    secrets:
      oc_token:
        required: true
      database_url:
        required: true
      secret_key:
        required: true
      s3_endpoint_url:
        required: true
      s3_access_key:
        required: true
      s3_secret_key:
        required: true
      s3_bucket:
        required: true
      keycloak_server_url:
        required: true
      keycloak_realm:
        required: true
      keycloak_client_id:
        required: true
      keycloak_client_secret:
        required: true
      keycloak_redirect_uri:
        required: true
      initial_admin_email:
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    environment:
      name: ${{ inputs.environment }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      triggered: ${{ steps.meta.outputs.triggered }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Resolve deployment metadata
        id: meta
        shell: bash
        run: |
          echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "triggered=true"       >> "$GITHUB_OUTPUT"

      # ── Deploy Crunchy PostgreSQL ─────────────────────────────────────────
      - name: Deploy Crunchy PostgreSQL
        uses: bcgov/action-crunchy@v2.0.0
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.OC_SERVER }}
          environment: ${{ inputs.environment }}
          values_file: >-
            ${{
              inputs.environment == 'prod' && 'charts/crunchy/values-prod.yml' ||
              inputs.environment == 'test' && 'charts/crunchy/values-test.yml' ||
              'charts/crunchy/values.yml'
            }}
          s3_access_key: ${{ secrets.s3_access_key }}
          s3_secret_key: ${{ secrets.s3_secret_key }}
          s3_bucket: ${{ secrets.s3_bucket }}
          s3_endpoint: ${{ secrets.s3_endpoint_url }}

      # ── Deploy application via Helm ───────────────────────────────────────
      - name: Helm upgrade / install
        uses: bcgov/action-oc-runner@v1.4.1
        with:
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.OC_SERVER }}
          commands: |
            set -euo pipefail

            RELEASE_NAME="transportation-forms-${{ inputs.environment }}"
            CHART="charts/app"
            TAG="${{ inputs.tag }}"
            ENV="${{ inputs.environment }}"

            # Determine values file override (test/prod have specific files)
            VALUES_OVERRIDE=""
            if [[ "$ENV" == "test" ]]; then
              VALUES_OVERRIDE="-f ${CHART}/values-test.yaml"
            elif [[ "$ENV" == "prod" ]]; then
              VALUES_OVERRIDE="-f ${CHART}/values-prod.yaml"
            fi

            helm upgrade --install "${RELEASE_NAME}" "${CHART}" \
              --namespace "${{ vars.OC_NAMESPACE }}" \
              -f "${CHART}/values.yaml" \
              ${VALUES_OVERRIDE} \
              --set-string global.tag="${TAG}" \
              --set global.registry=ghcr.io \
              --set global.repository=bcgov/transportation-forms \
              --set secrets.databaseUrl="${{ secrets.database_url }}" \
              --set secrets.secretKey="${{ secrets.secret_key }}" \
              --set secrets.s3EndpointUrl="${{ secrets.s3_endpoint_url }}" \
              --set secrets.s3AccessKey="${{ secrets.s3_access_key }}" \
              --set secrets.s3SecretKey="${{ secrets.s3_secret_key }}" \
              --set secrets.s3Bucket="${{ secrets.s3_bucket }}" \
              --set secrets.keycloakServerUrl="${{ secrets.keycloak_server_url }}" \
              --set secrets.keycloakRealm="${{ secrets.keycloak_realm }}" \
              --set secrets.keycloakClientId="${{ secrets.keycloak_client_id }}" \
              --set secrets.keycloakClientSecret="${{ secrets.keycloak_client_secret }}" \
              --set secrets.keycloakRedirectUri="${{ secrets.keycloak_redirect_uri }}" \
              --set secrets.initialAdminEmail="${{ secrets.initial_admin_email }}" \
              ${{ inputs.params }} \
              --timeout 10m \
              --wait \
              --atomic
