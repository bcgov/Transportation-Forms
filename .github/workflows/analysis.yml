name: Analysis

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # Weekly scan every Saturday at 09:00 UTC
    - cron: "0 9 * * 6"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 2. Unit tests + coverage ─────────────────────────────────────────────
  test:
    name: Unit Tests (80%+ Coverage)
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: transportation
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: transportation_forms
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://transportation:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/transportation_forms
        run: alembic upgrade head || true

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://transportation:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/transportation_forms
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          pytest tests/ \
            --cov=backend \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junit-xml=test-results.xml \
            --verbose

      - name: Enforce 80% coverage threshold
        run: |
          COVERAGE=$(grep -oP '(?<=line-rate=")[^"]+' coverage.xml | head -1)
          PCT=$(python -c "print(int(float('${COVERAGE}') * 100))")
          echo "Coverage: ${PCT}%"
          if (( PCT < 80 )); then
            echo "Coverage ${PCT}% is below the 80% threshold."
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=bcgov
            -Dsonar.projectKey=bcgov_transportation-forms
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=backend
            -Dsonar.tests=tests
        continue-on-error: true   # SonarCloud not yet configured — will pass once SONAR_TOKEN is set

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results.xml
            htmlcov/

  # ── 3. Bandit security scan ───────────────────────────────────────────────
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit -r backend/ -c .bandit -ll -f json -o bandit-report.json
          bandit -r backend/ -c .bandit -ll

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json

  # ── 4. Trivy vulnerability / secret / misconfiguration scanning ───────────
  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Run Trivy (filesystem — code + IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          config: .github/trivy.yaml
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"   # Non-blocking — security tab shows results

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ── 5. CodeQL analysis ────────────────────────────────────────────────────
  # Disabled: GitHub's default CodeQL setup (Settings → Code security → Code scanning)
  # conflicts with this advanced workflow — only one can be active at a time.
  # To re-enable: disable the default setup in GitHub repo settings first, then uncomment below.
