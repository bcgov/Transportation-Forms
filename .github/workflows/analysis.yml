  #   steps:
  #     - uses: actions/checkout@v6.0.1
  #
  #     - name: Initialize CodeQL
  #       uses: github/codeql-action/init@v3
  #       with:
  #         languages: python
  #         queries: security-and-quality
  #
  #     - name: Autobuild
  #       uses: github/codeql-action/autobuild@v3
  #
  #     - name: Perform CodeQL analysis
  #       uses: github/codeql-action/analyze@v3
  #       with:
  #         category: codeql-python

  # ── 6. Aggregate results gate ────────────────────────────────────────────
  results:
    name: Analysis Results
    runs-on: ubuntu-latest
    needs: [bandit, trivy] #add 'test' later if you want to gate on unit tests as well
    if: always()
    steps:
      - name: Check all analysis jobs passed
        run: |
          FAILED=0
          for job_result in \
            "${{ needs.test.result }}" \
            "${{ needs.bandit.result }}"; do
            if [[ -n "$job_result" && "$job_result" != "success" && "$job_result" != "skipped" ]]; then
              echo "Job failed: ${job_result}"
              FAILED=1
            fi
          done
          # Trivy and CodeQL are informational — failures go to Security tab but do not block
          if [[ $FAILED -eq 1 ]]; then
            echo "One or more required analysis jobs failed."
            exit 1
          fi
          echo "All analysis checks passed."

