name: Deploy to DEV

on:
  push:
    branches:
      - master
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'apps/public-backend/**'
      - 'apps/public-frontend/**'
      - 'infra/charts/**'
      - 'requirements.txt'
      - 'entrypoint.sh'
  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force rebuild all images regardless of changes'
        type: boolean
        default: false
        required: false

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backend
            build_file: apps/backend/Dockerfile
            triggers: ('apps/backend/' 'requirements.txt' 'entrypoint.sh')
          - package: migrations
            build_file: apps/backend/migrations/Dockerfile
            triggers: ('apps/backend/alembic/' 'apps/backend/alembic.ini' 'apps/backend/migrations/')
          - package: frontend
            build_file: apps/frontend/Dockerfile
            triggers: ('apps/frontend/')
          - package: public-backend
            build_file: apps/public-backend/Dockerfile
            triggers: ('apps/public-backend/' 'infra/charts/public-backend/')
          - package: public-frontend
            build_file: apps/public-frontend/Dockerfile
            triggers: ('apps/public-frontend/' 'infra/charts/public-frontend/' 'infra/charts/public-frontend/files/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve triggers
        id: triggers
        run: |
          if [[ "${{ inputs.force_build_all }}" == "true" ]]; then
            echo "value=" >> $GITHUB_OUTPUT
          else
            echo "value=${{ matrix.triggers }}" >> $GITHUB_OUTPUT
          fi

      - name: Build or retag ${{ matrix.package }}
        uses: bcgov/action-builder-ghcr@v4.2.1
        with:
          package: ${{ matrix.package }}
          build_file: ${{ matrix.build_file }}
          build_context: .
          tags: |
            latest
            ${{ github.sha }}
          tag_fallback: latest
          #triggers: ${{ steps.triggers.outputs.value }}

  deploy-dev:
    name: Deploy to DEV
    needs: build
    if: |
      always() &&
      !contains(needs.build.result, 'failure') &&
      !contains(needs.build.result, 'cancelled')
    permissions:
      contents: read
    uses: ./.github/workflows/.deployer.yml
    with:
      environment: dev
      backend_tag: ${{ github.sha }}
      migrations_tag: ${{ github.sha }}
      frontend_tag: ${{ github.sha }}
      public_forms_base_url: https://forms-public-transportation-forms-dev.${{ vars.TARGET_ENV_DOMAIN || 'apps.silver.devops.gov.bc.ca' }}
      params: >-
        --set global.secrets.persist=false
        --set backend.env.corsOrigins=https://frontend-transportation-forms-dev.${{ vars.TARGET_ENV_DOMAIN || 'apps.silver.devops.gov.bc.ca' }}
        --set-string "public-backend.image.tag=${{ github.sha }}"
        --set-string "public-frontend.image.tag=${{ github.sha }}"
    secrets:
      oc_token: ${{ secrets.OC_TOKEN }}
      database_url: ${{ secrets.DATABASE_URL }}
      secret_key: ${{ secrets.SECRET_KEY }}
      s3_endpoint_url: ${{ secrets.S3_ENDPOINT_URL }}
      s3_access_key: ${{ secrets.S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.S3_SECRET_KEY }}
      s3_bucket: ${{ secrets.S3_BUCKET }}
      keycloak_server_url: ${{ secrets.KEYCLOAK_SERVER_URL }}
      keycloak_realm: ${{ secrets.KEYCLOAK_REALM }}
      keycloak_client_id: ${{ secrets.KEYCLOAK_CLIENT_ID }}
      keycloak_client_secret: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
      keycloak_redirect_uri: ${{ secrets.KEYCLOAK_REDIRECT_URI }}
      initial_admin_email: ${{ secrets.INITIAL_ADMIN_EMAIL }}
