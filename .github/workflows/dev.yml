name: Deploy to DEV

on:
  push:
    branches:
      - master
    paths:
      - 'alembic/**'
      - 'charts/**'
      - 'backend/**'
      - 'frontend/**'
      - 'migrations/**'
      - 'public-backend/**'
      - 'public-frontend/**'
      - 'requirements.txt'
      - 'entrypoint.sh'
  workflow_dispatch:

jobs:
  # ── Detect which components changed ─────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      migrations: ${{ steps.filter.outputs.migrations }}
      frontend: ${{ steps.filter.outputs.frontend }}
      public-backend: ${{ steps.filter.outputs.public-backend }}
      public-frontend: ${{ steps.filter.outputs.public-frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'requirements.txt'
              - 'entrypoint.sh'
            migrations:
              - 'alembic/**'
              - 'alembic.ini'
              - 'migrations/**'
            frontend:
              - 'frontend/**'
            public-backend:
              - 'public-backend/**'
              - 'charts/public-backend/**'
            public-frontend:
              - 'public-frontend/**'
              - 'charts/public-frontend/**'
              - 'charts/public-frontend/files/**'

  # ── Build backend image ──────────────────────────────────────────────────────
  build-backend:
    name: Build backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Build and push backend image
        uses: bcgov/action-builder-ghcr@v4.2.1
        with:
          package: backend
          tags: |
            latest
            ${{ github.sha }}
          tag_fallback: latest
          build_file: backend/Dockerfile
          build_context: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build migrations image ───────────────────────────────────────────────────
  build-migrations:
    name: Build migrations image
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Build and push migrations image
        uses: bcgov/action-builder-ghcr@v4.2.1
        with:
          package: migrations
          tags: |
            latest
            ${{ github.sha }}
          tag_fallback: latest
          build_file: migrations/Dockerfile
          build_context: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build frontend image ─────────────────────────────────────────────────────
  build-frontend:
    name: Build frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Build and push frontend image
        uses: bcgov/action-builder-ghcr@v4.2.1
        with:
          package: frontend
          tags: |
            latest
            ${{ github.sha }}
          tag_fallback: latest
          build_file: frontend/Dockerfile
          build_context: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build public-backend image ───────────────────────────────────────────────
  build-public-backend:
    name: Build public-backend image
    needs: changes
    if: needs.changes.outputs['public-backend'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Build and push public-backend image
        uses: bcgov/action-builder-ghcr@v4.2.1
        with:
          package: public-backend
          tags: |
            latest
            ${{ github.sha }}
          tag_fallback: latest
          build_file: public-backend/Dockerfile
          build_context: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build public-frontend image ──────────────────────────────────────────────
  build-public-frontend:
    name: Build public-frontend image
    needs: changes
    if: needs.changes.outputs['public-frontend'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Build and push public-frontend image
        uses: bcgov/action-builder-ghcr@v4.2.1
        with:
          package: public-frontend
          tags: |
            latest
            ${{ github.sha }}
          tag_fallback: latest
          build_file: public-frontend/Dockerfile
          build_context: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Deploy to DEV ────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to DEV
    needs: [changes, build-backend, build-migrations, build-frontend, build-public-backend, build-public-frontend]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
    uses: ./.github/workflows/.deployer.yml
    with:
      environment: dev
      backend_tag: ${{ needs.build-backend.result == 'success' && github.sha || 'latest' }}
      migrations_tag: ${{ needs.build-migrations.result == 'success' && github.sha || 'latest' }}
      frontend_tag: ${{ needs.build-frontend.result == 'success' && github.sha || 'latest' }}
      public_forms_base_url: https://forms-public-transportation-forms-dev.${{ vars.TARGET_ENV_DOMAIN || 'apps.silver.devops.gov.bc.ca' }}
      params: >-
        --set global.secrets.persist=false
        --set backend.env.corsOrigins=https://frontend-transportation-forms-dev.${{ vars.TARGET_ENV_DOMAIN || 'apps.silver.devops.gov.bc.ca' }}
        --set-string "public-backend.image.tag=${{ needs.build-public-backend.result == 'success' && github.sha || 'latest' }}"
        --set-string "public-frontend.image.tag=${{ needs.build-public-frontend.result == 'success' && github.sha || 'latest' }}"
    secrets:
      oc_token: ${{ secrets.OC_TOKEN }}
      database_url: ${{ secrets.DATABASE_URL }}
      secret_key: ${{ secrets.SECRET_KEY }}
      s3_endpoint_url: ${{ secrets.S3_ENDPOINT_URL }}
      s3_access_key: ${{ secrets.S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.S3_SECRET_KEY }}
      s3_bucket: ${{ secrets.S3_BUCKET }}
      keycloak_server_url: ${{ secrets.KEYCLOAK_SERVER_URL }}
      keycloak_realm: ${{ secrets.KEYCLOAK_REALM }}
      keycloak_client_id: ${{ secrets.KEYCLOAK_CLIENT_ID }}
      keycloak_client_secret: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
      keycloak_redirect_uri: ${{ secrets.KEYCLOAK_REDIRECT_URI }}
      initial_admin_email: ${{ secrets.INITIAL_ADMIN_EMAIL }}
