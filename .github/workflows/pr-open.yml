name: PR Open

on:
  workflow_dispatch:
  #pull_request:
    #types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # ── 1. Build images (conditionally, via triggers) ────────────────────────
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Build and push backend image
        uses: bcgov/action-builder-ghcr@v4.2.1
        with:
          package: backend
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('apps/backend/' 'requirements.txt' 'entrypoint.sh')
          build_file: apps/backend/Dockerfile
          build_context: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-migrations:
    name: Build migrations image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Build and push migrations image
        uses: bcgov/action-builder-ghcr@v4.2.1
        with:
          package: migrations
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('apps/backend/alembic/' 'apps/backend/alembic.ini' 'apps/backend/migrations/')
          build_file: apps/backend/migrations/Dockerfile
          build_context: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Build and push frontend image
        uses: bcgov/action-builder-ghcr@v4.2.1
        with:
          package: frontend
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('apps/frontend/')
          build_file: apps/frontend/Dockerfile
          build_context: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-public-backend:
    name: Build public-backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Build and push public-backend image
        uses: bcgov/action-builder-ghcr@v4.2.1
        with:
          package: public-backend
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('apps/public-backend/' 'infra/charts/public-backend/')
          build_file: apps/public-backend/Dockerfile
          build_context: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-public-frontend:
    name: Build public-frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Build and push public-frontend image
        uses: bcgov/action-builder-ghcr@v4.2.1
        with:
          package: public-frontend
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('apps/public-frontend/' 'infra/charts/public-frontend/')
          build_file: apps/public-frontend/Dockerfile
          build_context: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Deploy to DEV with PR-scoped release name ─────────────────────────
  deploys:
    name: Deploy PR-${{ github.event.number }} to DEV
    needs: [build-backend, build-migrations, build-frontend, build-public-backend, build-public-frontend]
    uses: ./.github/workflows/.deployer.yml
    with:
      environment: dev
      backend_tag: ${{ github.event.number }}
      migrations_tag: ${{ github.event.number }}
      frontend_tag: ${{ github.event.number }}
      public_forms_base_url: https://forms-public-transportation-forms-${{ github.event.number }}.${{ vars.TARGET_ENV_DOMAIN || 'apps.silver.devops.gov.bc.ca' }}
      params: >-
        --set global.secrets.persist=false
        --set backend.env.corsOrigins=https://frontend-transportation-forms-${{ github.event.number }}.${{ vars.TARGET_ENV_DOMAIN || 'apps.silver.devops.gov.bc.ca' }}
        --set-string "public-backend.image.tag=${{ github.event.number }}"
        --set-string "public-frontend.image.tag=${{ github.event.number }}"
    secrets:
      oc_token: ${{ secrets.OC_TOKEN }}
      database_url: ${{ secrets.DATABASE_URL }}
      secret_key: ${{ secrets.SECRET_KEY }}
      s3_endpoint_url: ${{ secrets.S3_ENDPOINT_URL }}
      s3_access_key: ${{ secrets.S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.S3_SECRET_KEY }}
      s3_bucket: ${{ secrets.S3_BUCKET }}
      keycloak_server_url: ${{ secrets.KEYCLOAK_SERVER_URL }}
      keycloak_realm: ${{ secrets.KEYCLOAK_REALM }}
      keycloak_client_id: ${{ secrets.KEYCLOAK_CLIENT_ID }}
      keycloak_client_secret: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
      keycloak_redirect_uri: ${{ secrets.KEYCLOAK_REDIRECT_URI }}
      initial_admin_email: ${{ secrets.INITIAL_ADMIN_EMAIL }}

  # ── 3. Run integration tests against the PR deployment ───────────────────
  tests:
    name: Integration Tests (PR-${{ github.event.number }})
    needs: [deploys]
    if: needs.deploys.outputs.triggered == 'true'
    uses: ./.github/workflows/.tests.yml
    with:
      target: ${{ github.event.number }}
    secrets:
      oc_token: ${{ secrets.OC_TOKEN }}

  # ── 4. Aggregate results ─────────────────────────────────────────────────
  results:
    name: PR Results
    runs-on: ubuntu-latest
    needs: [build-backend, build-migrations, build-frontend, build-public-backend, build-public-frontend, deploys, tests]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          BUILDS_BACKEND="${{ needs.build-backend.result }}"
          BUILDS_MIGRATIONS="${{ needs.build-migrations.result }}"
          BUILDS_FRONTEND="${{ needs.build-frontend.result }}"
          BUILDS_PUBLIC_BACKEND="${{ needs.build-public-backend.result }}"
          BUILDS_PUBLIC_FRONTEND="${{ needs.build-public-frontend.result }}"
          DEPLOYS="${{ needs.deploys.result }}"
          TESTS="${{ needs.tests.result }}"
          echo "backend=${BUILDS_BACKEND} migrations=${BUILDS_MIGRATIONS} frontend=${BUILDS_FRONTEND} public-backend=${BUILDS_PUBLIC_BACKEND} public-frontend=${BUILDS_PUBLIC_FRONTEND} deploys=${DEPLOYS} tests=${TESTS}"
          if [[ "$BUILDS_BACKEND"         != "success" && "$BUILDS_BACKEND"         != "skipped" ]]; then exit 1; fi
          if [[ "$BUILDS_MIGRATIONS"      != "success" && "$BUILDS_MIGRATIONS"      != "skipped" ]]; then exit 1; fi
          if [[ "$BUILDS_FRONTEND"        != "success" && "$BUILDS_FRONTEND"        != "skipped" ]]; then exit 1; fi
          if [[ "$BUILDS_PUBLIC_BACKEND"  != "success" && "$BUILDS_PUBLIC_BACKEND"  != "skipped" ]]; then exit 1; fi
          if [[ "$BUILDS_PUBLIC_FRONTEND" != "success" && "$BUILDS_PUBLIC_FRONTEND" != "skipped" ]]; then exit 1; fi
          if [[ "$DEPLOYS"                != "success" && "$DEPLOYS"                != "skipped" ]]; then exit 1; fi
          if [[ "$TESTS"                  != "success" && "$TESTS"                  != "skipped" ]]; then exit 1; fi
          echo "All PR checks passed."
