# Blocking Trivy secret scan configuration for FEAT-0017.
# This gate scans test files too so synthetic PEM private-key probes fail CI.

scan:
  scanners:
    - secret

severity:
  - CRITICAL
  - HIGH

secret:
  config: .github/trivy-secret.yaml

skip-dirs:
  - .git
  - .venv
  - venv314
  - node_modules
  - htmlcov