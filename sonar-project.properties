# SonarCloud configuration for Transportation Forms
# The SONAR_TOKEN secret must be set in GitHub Actions for scans to upload.

sonar.organization=bcgov
sonar.projectKey=bcgov_transportation-forms

sonar.sources=backend
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml

# Exclude generated / non-source files
sonar.exclusions=**/__pycache__/**,**/migrations/**,**/*.pyc
sonar.test.exclusions=**/conftest.py
