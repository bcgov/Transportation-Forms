# ── Local Deployment Taskfile ─────────────────────────────────────────────────
#
# Mirrors the GitHub CI/CD pipeline (.github/workflows/dev.yml and
# .github/workflows/.deployer.yml) for local development on Rancher Desktop (k3s).
#
# Install:
#   brew install go-task        (macOS / Linux)
#   winget install Task.Task    (Windows)
#
# Prerequisites:
#   - Rancher Desktop installed with dockerd (moby) engine (not containerd)
#   - Helm 3.x installed and kubectl context set to rancher-desktop
#   - Root .env file populated with valid credentials (S3_*, KEYCLOAK_*, SECRET_KEY,
#     INITIAL_ADMIN_EMAIL — all pointing to datacenter services, NOT local containers)
#   - git available in PATH (for cloning the action-crunchy chart on first run)
#   - On Windows: C:\Program Files\Git\bin must be in PATH (provides sh.exe for Task)
#
# Usage:
#   cd deploy/local && task all          # full pipeline
#   task -d deploy/local all             # from repo root
#   task -d deploy/local build           # rebuild images only
#   task -d deploy/local deploy          # redeploy app only
#   task -d deploy/local teardown:all    # remove everything
# ─────────────────────────────────────────────────────────────────────────────

version: "3"

dotenv: ["../../.env"]

vars:
  TAG: local
  ENV: local
  RELEASE_NAME: transportation-forms-local
  CRUNCHY_RELEASE: transportation-forms-local-crunchy
  CHART: charts/app
  CRUNCHY_CACHE: deploy/local/.action-crunchy

set: [errexit, pipefail]

tasks:
  # ── Build tasks (mirror the builds matrix job in dev.yml) ──────────────────

  build:backend:
    desc: Build the backend Docker image (tagged local)
    dir: ../..
    cmds:
      - docker build -f backend/Dockerfile -t ghcr.io/bcgov/transportation-forms/backend:{{.TAG}} .

  build:frontend:
    desc: Build the frontend Docker image (tagged local)
    dir: ../..
    cmds:
      - docker build -f frontend/Dockerfile -t ghcr.io/bcgov/transportation-forms/frontend:{{.TAG}} .

  build:migrations:
    desc: Build the migrations Docker image (tagged local)
    dir: ../..
    cmds:
      - docker build -f migrations/Dockerfile -t ghcr.io/bcgov/transportation-forms/migrations:{{.TAG}} .

  build:
    desc: Build all Docker images in parallel
    deps:
      - build:backend
      - build:frontend
      - build:migrations

  # ── Database tasks (mirror Crunchy deployment in .deployer.yml) ────────────

  setup:pgo:
    desc: Install the Crunchy PGO operator on k3s (idempotent)
    dir: ../..
    cmds:
      - |
        if helm status pgo -n postgres-operator >/dev/null 2>&1; then
          echo "PGO operator already installed — skipping."
        else
          echo "Installing PGO operator via Helm OCI chart..."
          kubectl create namespace postgres-operator --dry-run=client -o yaml | kubectl apply -f -
          helm install pgo \
            oci://registry.developers.crunchydata.com/crunchydata/pgo \
            --version 5.8.5 \
            -n postgres-operator \
            --timeout 120s \
            --wait
        fi
      - |
        echo "Waiting for PGO operator to become ready..."
        kubectl wait --for=condition=Available deployment/pgo \
          -n postgres-operator --timeout=120s

  deploy:db:
    desc: Deploy Crunchy PostgreSQL to k3s (mirrors .deployer.yml)
    dir: ../..
    cmds:
      # Clone bcgov/action-crunchy repo (cached) if not already present
      - |
        if [ ! -d "{{.CRUNCHY_CACHE}}" ]; then
          echo "Cloning bcgov/action-crunchy v2.0.0..."
          git clone --branch v2.0.0 --depth 1 \
            https://github.com/bcgov/action-crunchy.git "{{.CRUNCHY_CACHE}}"
        else
          echo "Using cached action-crunchy chart."
        fi
      # Fix for K3s: The action-crunchy chart includes a strict NetworkPolicy that blocks
      # cross-namespace or pod-to-pod communication. We remove it locally.
      - rm -f "{{.CRUNCHY_CACHE}}/charts/crunchy/templates/knp.yaml"
      # Deploy Crunchy using the action's chart + project values + local overrides
      - |
        helm upgrade --install "{{.CRUNCHY_RELEASE}}" \
          "{{.CRUNCHY_CACHE}}/charts/crunchy" \
          -f charts/crunchy/values.yml \
          -f deploy/local/crunchy-overrides.yaml \
          --timeout 5m
      # Patch openshift: true → false (hardcoded in chart template, not for k3s)
      - |
        echo "Patching PostgresCluster for k3s (openshift: false)..."
        kubectl patch postgrescluster {{.CRUNCHY_RELEASE}}-crunchy \
          --type merge -p '{"spec":{"openshift":false}}'
      # Wait for the PostgresCluster primary to become ready
      - |
        echo "Waiting for Crunchy PostgreSQL primary to become ready..."
        kubectl wait --for=condition=Ready pod \
          -l postgres-operator.crunchydata.com/role=master,postgres-operator.crunchydata.com/cluster={{.CRUNCHY_RELEASE}}-crunchy \
          --timeout=180s 2>/dev/null || \
        kubectl wait --for=condition=Ready pod \
          -l postgres-operator.crunchydata.com/data=postgres,postgres-operator.crunchydata.com/cluster={{.CRUNCHY_RELEASE}}-crunchy \
          --timeout=180s

  # ── App deploy task (mirrors helm upgrade/install in .deployer.yml) ────────

  deploy:
    desc: Deploy the application via Helm (mirrors .deployer.yml)
    dir: ../..
    cmds:
      - |
        # Extract the pre-built DATABASE_URL (uri) directly from Crunchy-generated secret.
        CRUNCHY_SECRET="{{.CRUNCHY_RELEASE}}-crunchy-pguser-app"
        DB_URI=$(kubectl get secret "$CRUNCHY_SECRET" -o jsonpath="{.data.uri}" | base64 -d)

        if [ -z "$DB_URI" ]; then
          echo "ERROR: Could not extract DATABASE_URL (uri) from Crunchy secret."
          echo "Ensure deploy:db has completed successfully."
          exit 1
        fi

        echo "Deploying application with Helm..."
        helm upgrade --install "{{.RELEASE_NAME}}" "{{.CHART}}" \
          -f "{{.CHART}}/values.yaml" \
          -f "{{.CHART}}/values-local.yaml" \
          --set-string global.tag="{{.TAG}}" \
          --set-string secrets.databaseUrl="${DB_URI}" \
          --set secrets.secretKey="${SECRET_KEY}" \
          --set secrets.s3EndpointUrl="${S3_ENDPOINT_URL}" \
          --set secrets.s3AccessKey="${S3_ACCESS_KEY}" \
          --set secrets.s3SecretKey="${S3_SECRET_KEY}" \
          --set secrets.s3Bucket="${S3_BUCKET}" \
          --set secrets.keycloakServerUrl="${KEYCLOAK_SERVER_URL}" \
          --set secrets.keycloakRealm="${KEYCLOAK_REALM}" \
          --set secrets.keycloakClientId="${KEYCLOAK_CLIENT_ID}" \
          --set secrets.keycloakClientSecret="${KEYCLOAK_CLIENT_SECRET}" \
          --set secrets.keycloakRedirectUri="${KEYCLOAK_REDIRECT_URI}" \
          --set secrets.initialAdminEmail="${INITIAL_ADMIN_EMAIL}" \
          --timeout 10m \
          --wait

      # The Helm chart templates lack an ingress definition, so we apply one manually
      # to expose the frontend and backend locally on Rancher Desktop's default port 80.
      - |
        echo "Applying local ingress..."
        kubectl apply -f deploy/local/ingress.yaml

  # ── Orchestration tasks ────────────────────────────────────────────────────

  all:
    desc: "Full pipeline: setup PGO → build + deploy DB → deploy app"
    cmds:
      - task: setup:pgo
      - task: _build-and-db
      - task: deploy

  _build-and-db:
    internal: true
    deps:
      - build
      - deploy:db

  teardown:
    desc: Uninstall the application Helm release (keeps database)
    dir: ../..
    cmds:
      - kubectl delete -f deploy/local/ingress.yaml --ignore-not-found || true
      - helm uninstall {{.RELEASE_NAME}} || true

  teardown:all:
    desc: Uninstall both the application and Crunchy PostgreSQL releases
    dir: ../..
    cmds:
      - kubectl delete -f deploy/local/ingress.yaml --ignore-not-found || true
      - helm uninstall {{.RELEASE_NAME}} || true
      - helm uninstall {{.CRUNCHY_RELEASE}} || true
