# ── TEST environment overrides ────────────────────────────────────────────────
# Applied on top of values.yaml: helm upgrade ... -f values.yaml -f values-test.yaml

global:
  tag: test
  secrets:
    persist: true

domain: apps.silver.devops.gov.bc.ca

backend:
  replicaCount: 2

  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  env:
    environment: test
    sqlalchemyEcho: "false"
    logLevel: WARNING
# ── Crunchy PostgreSQL ────────────────────────────────────────────────────────
  crunchy:
    enabled: false  # or true, depending on your environment

frontend:
  replicaCount: 2

  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
