apiVersion: v2
name: app
description: Transportation Forms — umbrella chart (backend + frontend + public API)
type: application
version: 0.4.0
appVersion: "2.0.0"
keywords:
  - transportation-forms
  - bcgov
  - openshift
home: https://github.com/bcgov/transportation-forms
maintainers:
  - name: BCGov Transportation Forms Team
dependencies:
  - name: backend
    version: "1.0.0"
    repository: "file://../backend"
  - name: frontend
    version: "1.0.0"
    repository: "file://../frontend"
  # ── FEAT-0005 public-forms portal ──────────────────────────────────────────
  # Both subcharts are conditionally enabled. Default OFF in DPR-1 so this
  # umbrella bump is a no-op for existing DEV/TEST/PROD releases until DPR-2
  # ships the NGINX edge config.
  - name: public-backend
    version: "1.2.0"
    repository: "file://../public-backend"
    condition: publicBackend.enabled
  - name: public-frontend
    version: "0.1.0"
    repository: "file://../public-frontend"
    condition: publicFrontend.enabled
