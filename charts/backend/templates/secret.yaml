# Helm-managed application secret.
#
# global.secrets.persist:
#   false (default / PR envs)  — secret is owned by this release and deleted
#                                when the release is removed.
#   true  (long-lived envs)    — "helm.sh/resource-policy: keep" annotation
#                                prevents accidental deletion during upgrades or
#                                rollbacks.
#
# All stringData values MUST be supplied at deploy time via --set or equivalent.
# Example (CI/CD workflow):
#   helm upgrade --install ... \
#     --set secrets.databaseUrl="${DATABASE_URL}" \
#     --set secrets.secretKey="${SECRET_KEY}" ...
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  {{- if .Values.global.secrets.persist }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | default "" | quote }}
  secret-key: {{ .Values.secrets.secretKey | default "" | quote }}
  s3-endpoint-url: {{ .Values.secrets.s3EndpointUrl | default "" | quote }}
  s3-access-key: {{ .Values.secrets.s3AccessKey | default "" | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | default "" | quote }}
  s3-bucket: {{ .Values.secrets.s3Bucket | default "" | quote }}
  keycloak-server-url: {{ .Values.secrets.keycloakServerUrl | default "" | quote }}
  keycloak-realm: {{ .Values.secrets.keycloakRealm | default "" | quote }}
  keycloak-client-id: {{ .Values.secrets.keycloakClientId | default "" | quote }}
  keycloak-client-secret: {{ .Values.secrets.keycloakClientSecret | default "" | quote }}
  keycloak-redirect-uri: {{ .Values.secrets.keycloakRedirectUri | default "" | quote }}
  initial-admin-email: {{ .Values.secrets.initialAdminEmail | default "" | quote }}
