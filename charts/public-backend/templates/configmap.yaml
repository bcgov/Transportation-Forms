apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "public-backend.fullname" . }}-nginx
  labels:
    {{- include "public-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-backend
data:
  nginx.conf: |
    # Rate limiting zone: 10 requests/minute per client IP.
    limit_req_zone $http_x_forwarded_for zone=public_api:10m rate=10r/m;

    # Response cache (on-disk, max 100 MB).
    proxy_cache_path /tmp/nginx-cache levels=1:2
                     keys_zone=api_cache:10m
                     max_size=100m
                     inactive=10m
                     use_temp_path=off;

    server {
        listen 8080;

        # Method restriction (defence-in-depth)
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405;
        }

        # Public API location
        location /api/public/ {
            limit_req          zone=public_api burst=15 nodelay;
            limit_req_status   429;

            proxy_cache            api_cache;
            proxy_cache_key        "$scheme$request_method$host$request_uri";
            proxy_cache_valid      200 5m;
            proxy_cache_use_stale  error timeout updating;

            proxy_hide_header      Set-Cookie;
            proxy_ignore_headers   Set-Cookie;

            proxy_set_header  X-Request-ID  $request_id;
            proxy_set_header  Host          $host;
            proxy_set_header  X-Real-IP     $remote_addr;

            proxy_pass  http://127.0.0.1:8000;
        }

        # Health probes (no rate limit)
        location = /healthz {
            proxy_pass  http://127.0.0.1:8000/healthz;
        }

        location = /readyz {
            proxy_pass  http://127.0.0.1:8000/readyz;
        }

        # Default — deny everything else
        location / {
            return 404;
        }
    }
