{{- if .Values.route.enabled }}
# ── OpenShift Route: Public API ───────────────────────────────────────────────
# DPR-1: gated and default OFF. The public-frontend NGINX edge (FEAT-0005) is
# the canonical ingress path; this Route is retained only as an emergency
# escape hatch and must remain disabled in normal operation.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "public-backend.fullname" . }}
  labels:
    {{- include "public-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-backend
  annotations:
    # Limit to BCGOV (matches frontend chart)
    haproxy.router.openshift.io/ip_whitelist: 142.22.0.0/16 142.23.0.0/16 142.24.0.0/16 142.25.0.0/16 142.26.0.0/16 142.27.0.0/16 142.28.0.0/16 142.29.0.0/16 142.30.0.0/16 142.31.0.0/16 142.32.0.0/16 142.33.0.0/16 142.34.0.0/16 142.35.0.0/16 142.36.0.0/16
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.rate-http: "100"
    haproxy.router.openshift.io/rate-limit-connections.rate-tcp: "100"
    haproxy.router.openshift.io/disable_cookies: "true"
spec:
  host: public-{{ .Release.Name }}.{{ .Values.domain }}
  to:
    kind: Service
    name: {{ include "public-backend.fullname" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
