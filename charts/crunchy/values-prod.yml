# Crunchy PostgreSQL HA — PROD environment overrides
# Applied on top of values.yml

crunchy:
  instances:
    replicas: 3
    dataVolumeClaimSpec:
      storage: 10Gi
      walStorage: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  proxy:
    pgBouncer:
      replicas: 2

  # S3-backed backups for PROD — credentials injected by deploy_db.sh via --set
  pgBackRest:
    backupPath: /backups/prod/cluster/version
    clusterCounter: 1
    retentionFullType: count
    s3:
      enabled: true
      retention: 7
      fullBackupSchedule: "0 3 * * 0"
      incrementalBackupSchedule: "0 1 * * 1-6"
      bucket: ~      # injected by deploy_db.sh
      endpoint: ~    # injected by deploy_db.sh
      accessKey: ~   # injected by deploy_db.sh
      secretKey: ~   # injected by deploy_db.sh
    pvc:
      fullBackupSchedule: "0 4 * * 0"
      incrementalBackupSchedule: "0 1 * * 1-6"
      volume:
        storage: 10Gi
