# Crunchy PostgreSQL HA — PROD environment overrides
# Applied on top of values.yml

crunchy:
  instances:
    - name: ha
      replicas: 3
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

  proxy:
    pgBouncer:
      replicas: 2

  # S3-backed backups for PROD — bucket and credentials supplied via cluster secrets
  backups:
    pgbackrest:
      repos:
        - name: repo1
          schedules:
            full: "0 3 * * 0"
            differential: "0 1 * * 1-6"
          s3:
            bucket: ""          # Override at deploy time: --set crunchy.backups.pgbackrest.repos[0].s3.bucket=...
            region: ""
            endpoint: ""
