# ── PROD environment overrides ────────────────────────────────────────────────
# Applied on top of values.yaml: helm upgrade ... -f values.yaml -f values-prod.yaml

global:
  secrets:
    persist: true

image:
  tag: prod

domain: apps.silver.devops.gov.bc.ca

replicaCount: 3

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 7
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

route:
  enabled: true

# ── DPR-2: enable Coraza block mode in PROD ──────────────────────────────────
coraza:
  ruleEngine: "On"

# ── DPR-2: S3 internal upstream — set per-env (consider Helm --set from a
#   GitHub Actions secret / ExternalSecrets if value must stay out of git).
s3:
  internalUpstream: ""
