# ── Global image settings (overridden per environment / PR) ───────────────────
global:
  registry: ghcr.io
  repository: bcgov/transportation-forms
  secrets:
    # false  → Helm will delete secrets when the release is removed (safe for PR envs)
    # true   → Helm will not delete secrets on release removal (safe for long-lived envs)
    persist: false

# ── Image (single-NGINX edge with Coraza WAF + SPA assets) ────────────────────
image:
  repository: ghcr.io/bcgov/transportation-forms/public-frontend
  tag: latest
  pullPolicy: Always

# ── OpenShift domain (used to build route hostnames) ─────────────────────────
domain: apps.silver.devops.gov.bc.ca

nameOverride: ""
fullnameOverride: ""

# ── PUBLIC_BASE_URL — externally visible base URL for OG / sitemap / robots ──
# Empty by default; override per environment (e.g. https://forms-public-dev.apps.silver.devops.gov.bc.ca)
publicBaseUrl: ""

# ── Backend upstream (constructed in deployment.yaml as
#     http://<release>-public-backend:<backendPort> if not overridden) ────────
backendPort: 8000

# ── Replica / scaling ─────────────────────────────────────────────────────────
replicaCount: 1

containerPort: 3000
healthPort: 3001
servicePort: 3000

# Recreate when a single replica; switch to RollingUpdate in test/prod values.
deploymentStrategy:
  type: Recreate

resources:
  requests:
    cpu: "20m"
    memory: "50Mi"
  limits:
    cpu: "100m"
    memory: "150Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ── Health probes (target the dedicated health port — no WAF overhead) ───────
startupProbe:
  failureThreshold: 15
  periodSeconds: 2

readinessProbe:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

livenessProbe:
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

revisionHistoryLimit: 3

# ── Pod-level security context ────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 0
  fsGroup: 0
  seccompProfile:
    type: RuntimeDefault

# ── Container-level security context (hardened) ──────────────────────────────
containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 0
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: public-frontend

# ── ServiceAccount ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ── OpenShift Route (gated; default OFF for DPR-1 inert merge) ───────────────
route:
  enabled: false
  # Override host if you don't want the default forms-public-{release}.{domain}
  host: ""

# ── Plain Ingress (gated; for k3s / Rancher Desktop local; default OFF) ──────
ingress:
  enabled: false
  className: ""
  host: forms-public.localhost
  annotations: {}
  tls: []

# ── Network policies (default ON in cluster envs; disabled by values-local) ──
networkPolicy:
  enabled: true

# ── Internal-auth shared secret (Helm-managed; persisted via lookup) ─────────
# The secret is generated by templates/secret-internal-auth.yaml using
# `lookup` + `randAlphaNum 64` so the value persists across `helm upgrade`s
# AND survives `helm uninstall` (helm.sh/resource-policy: keep).
internalAuth:
  # Secret name pattern; keep blank to use {{ fullname }}-internal-auth.
  secretName: ""
  # Key inside the Secret holding the 64-char alphanumeric token.
  secretKey: secret

# ── Coraza WAF mode (DPR-2) ──────────────────────────────────────────────────
# DEV runs DetectionOnly so we observe rule hits without breaking traffic;
# TEST/PROD overlay flips this to "On" (block mode).
coraza:
  ruleEngine: DetectionOnly

# ── S3 internal upstream for X-Accel-Redirect /internal-s3/ ──────────────────
# Empty in DEV (no S3 binding); TEST/PROD must set this to the in-cluster /
# private S3 endpoint host. The path is rewritten by NGINX (/internal-s3/<key>
# → <upstream>/<key>) and the location is marked `internal;` so external
# clients cannot reach it directly.
s3:
  internalUpstream: ""
