# ─────────────────────────────────────────────────────────────────────────────
# public-frontend main nginx.conf — baked into the image at /etc/nginx/nginx.conf
#
# DPR-2: this replaces the upstream coraza-nginx default so we can:
#   • declare http{}-level zones (proxy_cache_path, limit_req_zone) at boot
#   • include /etc/nginx/conf.d/maps/*.conf for the bot-UA map (configmap)
#   • include /etc/nginx/conf.d/*.conf for the rendered server block + upstream
#
# All conf.d/* + conf.d/maps/* content is rendered by /entrypoint.sh from
# ConfigMap-supplied templates at container start.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
pid /var/run/nginx/nginx.pid;

# Coraza WAF connector (shipped by owasp/coraza-nginx base image).
load_module modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ── MIME / basic hardening ───────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # ── Logging (stdout/stderr — see Dockerfile symlinks) ────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # ── http{}-level rate-limit zone (US-009: 10 r/m / IP for /api/public/v1/) ─
    limit_req_zone $binary_remote_addr zone=public:10m rate=10r/m;

    # ── http{}-level proxy cache (sitemap 1h, OG 10m, list 5m via overrides) ─
    proxy_cache_path /var/cache/nginx/proxy
                     levels=1:2
                     keys_zone=public_cache:10m
                     max_size=200m
                     inactive=1h
                     use_temp_path=off;

    # ── Includes ─────────────────────────────────────────────────────────────
    # bot UA map MUST be included at http{} level, hence here (not conf.d).
    include /etc/nginx/conf.d/maps/*.conf;
    # rendered upstream + server blocks
    include /etc/nginx/conf.d/*.conf;
}
