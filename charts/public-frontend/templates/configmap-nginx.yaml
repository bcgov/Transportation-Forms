    {{- include "public-frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-frontend
data:
  # ───────────────────────────────────────────────────────────────────────────
  # default.conf.template — rendered by /entrypoint.sh into
  # /etc/nginx/conf.d/00-default.conf.  Owns:
  #   • upstream upstream_public_backend  (FastAPI, in-cluste  #   • server :3000 — public traffic (Coraza WAF rate limit + cache)
  #   • server :3001 — health-only (it)
  # All ${VAR} placeholders are filled from env at container start.
  # ───────────────────────────────────────────────────────────────────────────
  default.conf.template: |
    upstream upstream_public_backend {
        server ${BACKEND_UPSTREAM_HOST}:${BACKEND_UPSTREAM_PORT};
        keepalive 32;
    }

    # The shared X-Internal-Auth token is injected on every proxied request.
    # Held in a map so the secret value is not re-evaluated per request.
    map $request_method $internal_auth_value {
        default "${INTERNAL_AUTH_SECRET}";
    }

    # ── :3000 — public edge (WAF + rate limit + cache + SPA shell) ───────────
    server {
        listen 3000 default_server;
        server_name _;

