{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "public-frontend.serviceAccountName" . }}
  labels:
    {{- include "public-frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-frontend
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
