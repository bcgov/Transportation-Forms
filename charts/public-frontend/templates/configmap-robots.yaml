apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "public-frontend.fullname" . }}-robots
  labels:
    {{- include "public-frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-frontend
data:
  # robots.txt — served from /usr/share/nginx/html/robots.txt (subPath mount).
  # The Sitemap URL contains a placeholder that NGINX rewrites at request time
  # via `sub_filter` in default.conf using the PUBLIC_BASE_URL env var, so the
  # same ConfigMap works in DEV/TEST/PROD without per-env templating.
  robots.txt: |
    User-agent: *
    Allow: /
    Disallow: /api/
    Disallow: /internal-s3/
    Sitemap: PUBLIC_BASE_URL_PLACEHOLDER/api/public/v1/sitemap.xml
