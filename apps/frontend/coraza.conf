# Coraza WAF Configuration
# OWASP Core Rule Set v4 – paranoia level 1 (recommended starting point)
#
# Base configuration uses the bundled coraza.conf-recommended and crs-setup
# included via load_owasp_crs in the Caddyfile. The directives below provide
# project-specific overrides and detection mode settings.

SecRuleEngine On

# ── Request body handling ─────────────────────────────────────────────────────
SecRequestBodyAccess On
# Limit request body size to 10 MB (attachments should go direct to MinIO)
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 131072

# ── Response body handling ────────────────────────────────────────────────────
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 10485760

# ── Logging ───────────────────────────────────────────────────────────────────
# Keep relevant WAF events without recording headers, payloads, or rule messages
# that can contain credentials, tokens, or personal information.
SecAuditEngine RelevantOnly
SecAuditLogParts AKZ
SecAuditLogType Serial
SecAuditLog /dev/stderr

# ── Paranoia level ────────────────────────────────────────────────────────────
# PL1 – low false-positive rate; suitable for a government forms application.
SecAction \
    "id:900000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.paranoia_level=1"

# ── Sampling (anomaly scoring) thresholds ────────────────────────────────────
SecAction \
    "id:900110,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# ── Project-specific exclusions ───────────────────────────────────────────────
# Allow JWT bearer tokens in Authorization header (large base64-encoded values)
# NOTE: Commented out — rule IDs 942100/942110 are not present in the bundled
# CRS version.  Re-enable when running against a full CRS install that includes
# these SQL-injection detection rules.
# SecRuleUpdateTargetById 942100 "!REQUEST_HEADERS:Authorization"
# SecRuleUpdateTargetById 942110 "!REQUEST_HEADERS:Authorization"
