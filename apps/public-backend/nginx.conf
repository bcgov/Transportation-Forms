# -------------------------------------------------------------------
# public-backend NGINX sidecar — edge controls
# -------------------------------------------------------------------

# Rate limiting zone: 10 requests/minute per client IP for FEAT-0004/0005
# endpoints. Uses X-Forwarded-For because the upstream load-balancer
# (HAProxy route) terminates TLS and forwards the real IP in that header.
limit_req_zone $http_x_forwarded_for zone=public_api:10m rate=10r/m;

# FEAT-0026 US-018 (2026-07-13) — CMS-specific rate + connection zones.
# Because the CMS human path bypasses the edge cache (US-017 BR-01) every
# anonymous read reaches FastAPI + Postgres.  The tighter zone (120 r/m
# per IP with a concurrent-connection cap) prevents the bypass from
# being weaponised for L7 abuse.
limit_req_zone  $http_x_forwarded_for zone=cms_public_api:10m rate=120r/m;
limit_conn_zone $http_x_forwarded_for zone=cms_public_conn:10m;

# Response cache (on-disk, max 100 MB).
proxy_cache_path /tmp/nginx-cache levels=1:2
                 keys_zone=api_cache:10m
                 max_size=100m
                 inactive=10m
                 use_temp_path=off;

server {
    listen 8080;

    # ---------------------------------------------------------------
    # Method restriction (defence-in-depth — also enforced by app)
    # ---------------------------------------------------------------
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # ---------------------------------------------------------------
    # FEAT-0026 CMS human path — cache-bypass (US-017) + tighter
    # rate/conn limits (US-018). Order matters: these specific location
    # blocks must precede the catch-all /api/public/ block below.
    # ---------------------------------------------------------------
    location = /api/public/v1/pages {
        limit_req         zone=cms_public_api burst=60 nodelay;
        limit_conn        cms_public_conn 20;
        limit_req_status  429;
        limit_conn_status 429;
        add_header        Retry-After 30 always;

        # No proxy_cache directive → sidecar bypasses cache for the nav
        # list so edits are visible on the very next hit.
        proxy_hide_header  Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        proxy_set_header   X-Request-ID  $request_id;
        proxy_set_header   Host          $host;
        proxy_set_header   X-Real-IP     $remote_addr;
        proxy_pass         http://127.0.0.1:8000;
    }

    location ~ ^/api/public/v1/pages/[^/]+$ {
        limit_req         zone=cms_public_api burst=60 nodelay;
        limit_conn        cms_public_conn 20;
        limit_req_status  429;
        limit_conn_status 429;
        add_header        Retry-After 30 always;

        proxy_hide_header  Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        proxy_set_header   X-Request-ID  $request_id;
        proxy_set_header   Host          $host;
        proxy_set_header   X-Real-IP     $remote_addr;
        proxy_pass         http://127.0.0.1:8000;
    }

    location ~ ^/api/public/v1/redirects/[^/]+$ {
        limit_req         zone=cms_public_api burst=60 nodelay;
        limit_conn        cms_public_conn 20;
        limit_req_status  429;
        limit_conn_status 429;
        add_header        Retry-After 30 always;

        proxy_hide_header  Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        proxy_set_header   X-Request-ID  $request_id;
        proxy_set_header   Host          $host;
        proxy_set_header   X-Real-IP     $remote_addr;
        proxy_pass         http://127.0.0.1:8000;
    }

    # CMS OG endpoint — bot/sitemap path, 24h sidecar cache (US-017 BR-02).
    location ~ ^/api/public/v1/pages/[^/]+/og$ {
        limit_req         zone=cms_public_api burst=60 nodelay;
        limit_conn        cms_public_conn 20;
        limit_req_status  429;
        limit_conn_status 429;
        add_header        Retry-After 30 always;

        proxy_cache            api_cache;
        proxy_cache_key        "$scheme$request_method$host$request_uri";
        proxy_cache_valid      200 24h;
        proxy_cache_use_stale  error timeout updating;

        proxy_hide_header  Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        proxy_set_header   X-Request-ID  $request_id;
        proxy_set_header   Host          $host;
        proxy_set_header   X-Real-IP     $remote_addr;
        proxy_pass         http://127.0.0.1:8000;
    }

    # ---------------------------------------------------------------
    # Public API location (FEAT-0004 / FEAT-0005 catch-all)
    # ---------------------------------------------------------------
    location /api/public/ {
        # Rate limiting
        limit_req          zone=public_api burst=15 nodelay;
        limit_req_status   429;

        # Response caching (honours upstream Cache-Control / ETag)
        proxy_cache            api_cache;
        proxy_cache_key        "$scheme$request_method$host$request_uri";
        proxy_cache_valid      200 5m;
        proxy_cache_use_stale  error timeout updating;

        # Strip Set-Cookie in both directions
        proxy_hide_header      Set-Cookie;
        proxy_ignore_headers   Set-Cookie;

        # Allow X-Accel-Redirect to bubble up to public-frontend NGINX
        proxy_pass_header      X-Accel-Redirect;

        # Propagate / generate X-Request-ID
        proxy_set_header  X-Request-ID  $request_id;
        proxy_set_header  Host          $host;
        proxy_set_header  X-Real-IP     $remote_addr;

        proxy_pass  http://127.0.0.1:8000;
    }

    # ---------------------------------------------------------------
    # Health probes — proxied to backend (no rate limit)
    # ---------------------------------------------------------------
    location = /healthz {
        proxy_pass  http://127.0.0.1:8000/healthz;
    }

    location = /readyz {
        proxy_pass  http://127.0.0.1:8000/readyz;
    }

    # ---------------------------------------------------------------
    # Default — deny everything else
    # ---------------------------------------------------------------
    location / {
        return 404;
    }
}
