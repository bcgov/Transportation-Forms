apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  strategy:
    {{- toYaml .Values.deploymentStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "backend.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      {{- if .Values.deployment.vault.enabled }}
      {{- $vaultPath := printf "%s/%s" .Values.deployment.vault.role .Values.deployment.vault.path }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-token: "false"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/auth-path: "auth/k8s-silver"
        vault.hashicorp.com/namespace: "platform-services"
        vault.hashicorp.com/role: {{ .Values.deployment.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-secrets.env: {{ $vaultPath | quote }}
        vault.hashicorp.com/agent-inject-template-secrets.env: |
          {{`{{- with secret "`}}{{ $vaultPath }}{{`" }}`}}
          {{`export SECRET_KEY="{{ .Data.data.SECRET_KEY }}"`}}
          {{`export JWT_PRIVATE_KEY_PEM="{{ .Data.data.JWT_PRIVATE_KEY_PEM }}"`}}
          {{`export JWT_PUBLIC_KEY_PEM="{{ .Data.data.JWT_PUBLIC_KEY_PEM }}"`}}
          {{`export S3_ENDPOINT_URL="{{ .Data.data.S3_ENDPOINT_URL }}"`}}
          {{`export S3_ACCESS_KEY="{{ .Data.data.S3_ACCESS_KEY }}"`}}
          {{`export S3_SECRET_KEY="{{ .Data.data.S3_SECRET_KEY }}"`}}
          {{`export S3_BUCKET="{{ .Data.data.S3_BUCKET }}"`}}
          {{`export KEYCLOAK_SERVER_URL="{{ .Data.data.KEYCLOAK_SERVER_URL }}"`}}
          {{`export KEYCLOAK_REALM="{{ .Data.data.KEYCLOAK_REALM }}"`}}
          {{`export KEYCLOAK_CLIENT_ID="{{ .Data.data.KEYCLOAK_CLIENT_ID }}"`}}
          {{`export KEYCLOAK_CLIENT_SECRET="{{ .Data.data.KEYCLOAK_CLIENT_SECRET }}"`}}
          {{`export KEYCLOAK_REDIRECT_URI="{{ .Data.data.KEYCLOAK_REDIRECT_URI }}"`}}
          {{`export INITIAL_ADMIN_EMAIL="{{ .Data.data.INITIAL_ADMIN_EMAIL }}"`}}
          {{`{{- end }}`}}
      {{- end }}
    spec:
      {{- if .Values.deployment.vault.enabled }}
      serviceAccountName: {{ required "backend.deployment.vault.serviceAccountName is required when Vault is enabled" .Values.deployment.vault.serviceAccountName | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
      # ── Init container: run Alembic migrations before the backend starts ────
      initContainers:
        - name: migrations
          image: {{ include "backend.migrationsImage" . }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend.crunchySecretName" . }}
                  key: uri
            {{- if not .Values.deployment.vault.enabled }}
            - name: INITIAL_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: initial-admin-email
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      # ── Main container ───────────────────────────────────────────────────────
      containers:
        - name: backend
          image: {{ include "backend.image" . }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: {{ .Values.env.environment | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend.crunchySecretName" . }}
                  key: uri
            - name: SQLALCHEMY_ECHO
              value: {{ .Values.env.sqlalchemyEcho | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.env.corsOrigins | quote }}
            - name: AUTH_COOKIE_SECURE
              value: {{ .Values.env.authCookieSecure | default "true" | quote }}
            {{- if not .Values.deployment.vault.enabled }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: secret-key
            - name: JWT_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: jwt-private-key-pem
            - name: JWT_PUBLIC_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: jwt-public-key-pem
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: s3-endpoint-url
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: s3-secret-key
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: s3-bucket
            - name: KEYCLOAK_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: keycloak-server-url
            - name: KEYCLOAK_REALM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: keycloak-realm
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: keycloak-client-id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: keycloak-client-secret
            - name: KEYCLOAK_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: keycloak-redirect-uri
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # ── Probes ─────────────────────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
