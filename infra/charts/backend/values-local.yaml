# ── Local / Rancher Desktop overrides ─────────────────────────────────────────
# Layer on top of values.yaml to run the Helm chart on k3s (Rancher Desktop)
# instead of OpenShift.
#
# Usage:
#   helm install transportation-forms-local infra/charts/backend \
#     -f infra/charts/backend/values.yaml \
#     -f infra/charts/backend/values-local.yaml \
#     --set image.tag=local \
#     --set secrets.databaseUrl="..." \
#     --set secrets.secretKey="..."

# ── Pull from local image cache (no ghcr.io pull) ────────────────────────────
global:
  registry: ghcr.io
  repository: bcgov/transportation-forms

image:
  tag: local
  migrationsTag: local

# ── Disable OpenShift Routes (not available on k3s) ──────────────────────────
routes:
  enabled: false

# ── Disable network policies (not needed on single-node dev cluster) ──────────
networkPolicy:
  enabled: false

# ── Lighter resource limits for local dev ─────────────────────────────────────
env:
  corsOrigins: "http://transportation-forms.local,http://localhost,http://127.0.0.1"
  # FEAT-0020 / SEC-004: Local dev runs over plain HTTP; browsers drop Secure
  # cookies on http:// origins, which would break /auth/refresh and the cookie
  # clear on /auth/logout. Disable the Secure flag only for the local cluster.
  authCookieSecure: "false"
resources:
  requests:
    cpu: "25m"
    memory: "64Mi"
  limits:
    cpu: "250m"
    memory: "512Mi"
