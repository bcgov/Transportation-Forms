# Crunchy PostgreSQL HA — base / DEV configuration
# Deployed via bcgov/action-crunchy in the deployer workflow.
# Schema validated against bcgov/action-crunchy@v2.0.0 PostgresCluster.yaml template.
#
# Documentation: https://access.crunchydata.com/documentation/postgres-operator/latest/
# BCGov action: https://github.com/bcgov/action-crunchy

global:
  config:
    dbName: app

crunchy:
  enabled: true
  imagePullPolicy: IfNotPresent
  postgresVersion: 18
  image: "artifacts.developer.gov.bc.ca/bcgov-docker-local/crunchy-postgres-gis:ubi9-18.1-3.6-2547"

  # ── Instances (object, not list) ─────────────────────────────────────────────
  instances:
    name: db
    replicas: 1
    dataVolumeClaimSpec:
      storage: 1Gi
      walStorage: 1Gi
      storageClassName: netapp-block-standard
    requests:
      cpu: 150m
      memory: 256Mi
    replicaCertCopy:
      requests:
        cpu: 1m
        memory: 32Mi

  # ── Application users ────────────────────────────────────────────────────────
  users:
    - name: app
      databases:
        - transportation_forms
    - name: pgbouncer

  # ── Monitoring — disabled for DEV ─────────────────────────────────────────────
  pgmonitor:
    enabled: false

  # ── PgBouncer ─────────────────────────────────────────────────────────────────
  proxy:
    enabled: true
    pgBouncer:
      replicas: 1
      maxConnections: 10
      requests:
        cpu: 5m
        memory: 32Mi

  # ── pgBackRest backups ────────────────────────────────────────────────────────
  pgBackRest:
    enabled: false  # S3 backups disabled for DEV
    s3:
      enabled: false   # No S3 for DEV — volume-based backups only
    pvc:
      retention: 1
      retentionFullType: count
      fullBackupSchedule: "0 8 * * 0"
      incrementalBackupSchedule: "0 2 * * 1-6"
      volume:
        accessModes: "ReadWriteOnce"
        storage: 1Gi
        storageClassName: netapp-file-backup
    repoHost:
      requests:
        cpu: 20m
        memory: 128Mi
    sidecars:
      requests:
        cpu: 5m
        memory: 16Mi
    jobs:
      requests:
        cpu: 20m
        memory: 128Mi

  # ── Patroni ───────────────────────────────────────────────────────────────────
  patroni:
    postgresql:
      pg_hba:
        - "host all all 0.0.0.0/0 md5"
        - "host all all ::1/128 md5"
      parameters:
        shared_buffers: 16MB
        wal_buffers: "64kB"
        min_wal_size: 32MB
        max_wal_size: 64MB
        max_slot_wal_keep_size: 128MB
        work_mem: 2MB
        log_min_duration_statement: 1000ms
        effective_io_concurrency: 20
