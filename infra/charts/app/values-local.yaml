# ── Local / Rancher Desktop overrides ─────────────────────────────────────────
# Layer on top of values.yaml to run the Helm chart on k3s (Rancher Desktop)
# instead of OpenShift.
#
# Usage:
#   helm install transportation-forms-local infra/charts/app \
#     -f infra/charts/app/values.yaml \
#     -f infra/charts/app/values-local.yaml \
#     --set backend.secrets.databaseUrl="..." \
#     --set backend.secrets.secretKey="..."

# ── Pull from local image cache (no ghcr.io pull) ────────────────────────────
global:
  registry: ghcr.io
  repository: bcgov/transportation-forms

# ── Ingress (nginx-ingress on k3s replaces OpenShift Routes) ─────────────────
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: transportation-forms.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 3000
        - path: /api
          pathType: Prefix
          service: backend
          port: 8000
        - path: /auth
          pathType: Prefix
          service: backend
          port: 8000

# ── Backend local overrides ───────────────────────────────────────────────────
backend:
  image:
    tag: local
    migrationsTag: local

  # Disable OpenShift Routes (not available on k3s)
  routes:
    enabled: false

  # Disable network policies (not needed on single-node dev cluster)
  networkPolicy:
    enabled: false

  env:
    corsOrigins: "http://transportation-forms.local,http://localhost,http://127.0.0.1"
    authCookieSecure: "false"

  # Lighter resource limits for local dev
  resources:
    requests:
      cpu: "25m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

# ── Frontend local overrides ──────────────────────────────────────────────────
frontend:
  image:
    tag: local

  # Disable OpenShift Routes (not available on k3s)
  routes:
    enabled: false

  # Disable network policies (not needed on single-node dev cluster)
  networkPolicy:
    enabled: false

  # Lighter resource limits for local dev
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

# ── FEAT-0005 public portal — local k3s parity ───────────────────────────────
# Condition gates (camelCase — read by Chart.yaml dep conditions)
publicBackend:
  enabled: true

publicFrontend:
  enabled: true

# ── Public-backend local overrides ────────────────────────────────────────────
public-backend:
  enabled: true

  image:
    tag: local

  # Disable OpenShift Route (not available on k3s)
  route:
    enabled: false

  # Disable network policies (not needed on single-node dev cluster)
  networkPolicy:
    enabled: false

  # Lighter resource limits for local dev
  resources:
    app:
      requests:
        cpu: "25m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "128Mi"

  startupProbe:
    failureThreshold: 60
    periodSeconds: 2

# ── Public-frontend subchart values (local) ──────────────────────────────────
public-frontend:
  image:
    tag: local
    pullPolicy: IfNotPresent

  route:
    enabled: false

  ingress:
    enabled: true
    className: ""         # traefik on k3s picks up no-className ingresses
    host: forms-public.localhost
    annotations: {}
    tls: []

  networkPolicy:
    enabled: false

  coraza:
    ruleEngine: DetectionOnly

  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "256Mi"
