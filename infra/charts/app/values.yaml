# ── Global image settings (registry/repo only; tags are per-component) ─────────
global:
  registry: ghcr.io
  repository: bcgov/transportation-forms
  secrets:
    # false  → Helm will delete secrets when the release is removed (safe for PR envs)
    # true   → Helm will not delete secrets on release removal (safe for long-lived envs)
    persist: false

# ── OpenShift domain ────────────────────────────────────────────────────────────
domain: apps.silver.devops.gov.bc.ca

nameOverride: ""
fullnameOverride: ""

# ── Backend subchart values ─────────────────────────────────────────────────────
backend:
  image:
    tag: latest
    digest: ""
    migrationsTag: latest
    migrationsDigest: ""

  replicaCount: 1

  containerPort: 8000
  servicePort: 8000

  deploymentStrategy:
    type: Recreate

  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "100m"
      memory: "256Mi"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  pdb:
    enabled: false
    minAvailable: 1

  # Startup probe allows up to 60 s (30 × 2 s) for cold start + migrations
  startupProbe:
    failureThreshold: 30
    periodSeconds: 2

  readinessProbe:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  secretName: transportation-forms-secrets

  env:
    environment: development
    sqlalchemyEcho: "false"
    logLevel: INFO
    corsOrigins: ""
    # All S3 credentials (endpoint, bucket, access key, secret key) are in the secrets section.
    # Do NOT add s3EndpointUrl or s3Bucket here with hardcoded defaults.

  # Pod anti-affinity encourages spreading replicas across nodes
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: backend

  crunchy:
    enabled: true

  routes:
    enabled: true
    host: ""

  networkPolicy:
    enabled: true

  secrets:
    databaseUrl: ""
    secretKey: ""
    jwtPrivateKeyPem: ""
    jwtPublicKeyPem: ""
    s3EndpointUrl: ""
    s3AccessKey: ""
    s3SecretKey: ""
    s3Bucket: ""
    keycloakServerUrl: ""
    keycloakRealm: ""
    keycloakClientId: ""
    keycloakClientSecret: ""
    keycloakRedirectUri: ""
    initialAdminEmail: ""

# ── Frontend subchart values ────────────────────────────────────────────────────
frontend:
  image:
    tag: latest
    digest: ""

  replicaCount: 1

  containerPort: 3000
  healthPort: 3001
  servicePort: 3000

  deploymentStrategy:
    type: Recreate

  resources:
    requests:
      cpu: "25m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "256Mi"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  pdb:
    enabled: false
    minAvailable: 1

  startupProbe:
    failureThreshold: 15
    periodSeconds: 2

  readinessProbe:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

  livenessProbe:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  # The frontend deployment constructs BACKEND_URL as:
  #   http://<release-name>-backend:<backendPort>
  backendPort: 8000

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: frontend

  routes:
    enabled: true

  networkPolicy:
    enabled: true

# ── Public-backend subchart values ──────────────────────────────────────────────
# The umbrella gates the public charts on the camelCase toggles below.
# Both are enabled for cluster environments and disabled by values-local.yaml.
publicBackend:
  enabled: true

publicFrontend:
  enabled: true

public-backend:
  enabled: true

  image:
    tag: latest
    digest: ""

  replicaCount: 1

  deploymentStrategy:
    type: Recreate

  resources:
    app:
      requests:
        cpu: "100m"
        memory: "192Mi"
      limits:
        cpu: "250m"
        memory: "384Mi"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

  pdb:
    enabled: false
    minAvailable: 1

  startupProbe:
    failureThreshold: 15
    periodSeconds: 2

  readinessProbe:
    path: /readyz
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

  livenessProbe:
    path: /healthz
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  secretName: transportation-forms-secrets

  env:
    environment: development
    logLevel: INFO
    publicCorsOrigins: ""
    cacheMaxAge: 300

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: public-backend

  # DPR-1 (FEAT-0005) — legacy Route gate; default off (cutover gate cleared)
  route:
    enabled: true

  networkPolicy:
    enabled: true

# ── Public-frontend subchart values ─────────────────────────────────────────────
public-frontend:
  image:
    tag: latest
    digest: ""

  replicaCount: 1

  route:
    enabled: true

  ingress:
    enabled: false

  networkPolicy:
    enabled: true

  publicBaseUrl: ""

  s3:
    internalUpstream: ""

  coraza:
    ruleEngine: DetectionOnly

