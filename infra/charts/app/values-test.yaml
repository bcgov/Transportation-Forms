# ── TEST environment overrides ────────────────────────────────────────────────
# Applied on top of values.yaml: helm upgrade ... -f values.yaml -f values-test.yaml

global:
  secrets:
    persist: true

domain: apps.silver.devops.gov.bc.ca

backend:
  image:
    tag: test
    digest: ""
    migrationsTag: test
    migrationsDigest: ""

  replicaCount: 2

  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  env:
    environment: test
    sqlalchemyEcho: "false"
    logLevel: WARNING

  crunchy:
    enabled: false

frontend:
  image:
    tag: test
    digest: ""

  replicaCount: 2

  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

publicBackend:
  enabled: true

publicFrontend:
  enabled: true

public-backend:
  image:
    tag: test
    digest: ""

  replicaCount: 1

  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  autoscaling:
    enabled: false

  pdb:
    enabled: false

  env:
    environment: test
    logLevel: WARNING

  route:
    enabled: false

  networkPolicy:
    enabled: true

public-frontend:
  image:
    tag: test
    digest: ""

  replicaCount: 1

  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  route:
    enabled: true

  networkPolicy:
    enabled: true

  coraza:
    ruleEngine: "On"
