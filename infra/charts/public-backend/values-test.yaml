# TEST environment overrides for a minimal direct-chart deployment.
global:
  secrets:
    persist: true

image:
  tag: test
  digest: ""

domain: apps.silver.devops.gov.bc.ca

replicaCount: 1

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

autoscaling:
  enabled: false

pdb:
  enabled: false

env:
  environment: test
  logLevel: WARNING

route:
  enabled: false

networkPolicy:
  enabled: true