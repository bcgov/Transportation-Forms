{{- if .Values.route.enabled }}
# ── OpenShift Route: Public Forms Portal ──────────────────────────────────────
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "public-frontend.fullname" . }}
  labels:
    {{- include "public-frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-frontend
  annotations:
    {{- if .Values.global.ipAccess.enabled }}
    haproxy.router.openshift.io/ip_whitelist: {{ required "global.ipAccess.routeProxyCidrs is required when IP access is enabled" .Values.global.ipAccess.routeProxyCidrs | quote }}
    {{- end }}
    # HAProxy rate limiting (requests per second per source IP)
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.rate-http: "100"
    haproxy.router.openshift.io/rate-limit-connections.rate-tcp: "100"
    # Disable cookie-based session affinity (NGINX edge is stateless)
    haproxy.router.openshift.io/disable_cookies: "true"
spec:
  host: {{ .Values.route.host | default (printf "forms-public-%s.%s" .Release.Name .Values.domain) }}
  to:
    kind: Service
    name: {{ include "public-frontend.fullname" . }}
    weight: 100
  port:
    targetPort: traffic
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
