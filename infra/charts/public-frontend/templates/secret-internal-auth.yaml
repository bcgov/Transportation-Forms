{{/*
Internal-auth Secret — Helm-managed, persisted across upgrades & uninstalls.

Strategy:
  • On first install (or if missing), generate `randAlphaNum 64` and
    base64-encode it once.
  • On subsequent renders, `lookup` the existing Secret and reuse its data
    so `helm upgrade` does not rotate the value.
  • `helm.sh/resource-policy: keep` makes Helm leave the Secret behind on
    `helm uninstall`, so re-installing the release reuses the same token
    (FE and BE Pods stay in sync without manual coordination).

The same Secret is mounted into the public-backend Pod via the public-backend
chart's `internalAuth.existingSecret` value (set to this Secret's name by the
umbrella chart).
*/}}
{{- $name := include "public-frontend.internalAuthSecretName" . -}}
{{- $key := .Values.internalAuth.secretKey -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $value := "" -}}
{{- if and $existing $existing.data (index $existing.data $key) -}}
{{- $value = index $existing.data $key -}}
{{- else -}}
{{- $value = randAlphaNum 64 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "public-frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-frontend
  annotations:
    # Survive `helm uninstall` so FE/BE stay aligned across release churn.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value }}
