{{- if .Values.ingress.enabled }}
# ── Plain Ingress (k3s / Rancher Desktop / non-OpenShift clusters) ────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "public-frontend.fullname" . }}
  labels:
    {{- include "public-frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: public-frontend
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "public-frontend.fullname" . }}
                port:
                  name: traffic
{{- end }}
