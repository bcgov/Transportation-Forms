# ── TEST environment overrides ────────────────────────────────────────────────
# Applied on top of values.yaml: helm upgrade ... -f values.yaml -f values-test.yaml

global:
  secrets:
    persist: true

image:
  tag: test
  digest: ""

domain: apps.silver.devops.gov.bc.ca

replicaCount: 1

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

route:
  enabled: true

networkPolicy:
  enabled: true

# ── DPR-2: enable Coraza block mode in TEST ──────────────────────────────────
coraza:
  ruleEngine: "On"

# ── DPR-2: S3 internal upstream — set per-env (consider Helm --set from a
#   GitHub Actions secret / ExternalSecrets if value must stay out of git).
s3:
  internalUpstream: ""
