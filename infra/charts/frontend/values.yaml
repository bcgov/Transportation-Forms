# ── Global image settings (overridden per environment / PR) ───────────────────
global:
  registry: ghcr.io
  repository: bcgov/transportation-forms
  secrets:
    # false  → Helm will delete secrets when the release is removed (safe for PR envs)
    # true   → Helm will not delete secrets on release removal (safe for long-lived envs)
    persist: false

# ── Image tag (scoped to this chart; overridden by parent umbrella chart) ─────
image:
  tag: latest
  digest: ""

# ── OpenShift domain (used to build route hostnames) ─────────────────────────
domain: apps.silver.devops.gov.bc.ca

nameOverride: ""
fullnameOverride: ""

# ── Frontend (Caddy + Coraza WAF) ─────────────────────────────────────────────
replicaCount: 1

containerPort: 3000
healthPort: 3001
servicePort: 3000

deploymentStrategy:
  type: Recreate

resources:
  requests:
    cpu: "25m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "256Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1

startupProbe:
  failureThreshold: 15
  periodSeconds: 2

readinessProbe:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

livenessProbe:
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# The frontend deployment constructs BACKEND_URL as:
#   http://<release-name>-backend:<backendPort>
backendPort: 8000

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: frontend

# ── OpenShift Routes (disable for local k8s / Rancher Desktop) ────────────────
routes:
  enabled: true

# ── Network Policies ──────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
