{{- if .Values.routes.enabled }}
# ── OpenShift Route: Frontend ─────────────────────────────────────────────────
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    # Limit to BCGOV
    haproxy.router.openshift.io/ip_whitelist: 142.22.0.0/16 142.23.0.0/16 142.24.0.0/16 142.25.0.0/16 142.26.0.0/16 142.27.0.0/16 142.28.0.0/16 142.29.0.0/16 142.30.0.0/16 142.31.0.0/16 142.32.0.0/16 142.33.0.0/16 142.34.0.0/16 142.35.0.0/16 142.36.0.0/16
    # HAProxy rate limiting (requests per second per source IP)
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.rate-http: "100"
    haproxy.router.openshift.io/rate-limit-connections.rate-tcp: "100"
    # Disable cookie-based session affinity (Caddy is stateless)
    haproxy.router.openshift.io/disable_cookies: "true"
spec:
  host: {{ .Values.routes.host | default (printf "frontend-%s.%s" .Release.Name .Values.domain) }}
  to:
    kind: Service
    name: {{ include "frontend.fullname" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
