# Local Deployment Taskfile
#
# Install:
#   brew install go-task        (macOS / Linux)
#   winget install Task.Task    (Windows)
#
# Prerequisites:
#   - Rancher Desktop installed with dockerd (moby) engine (not containerd)
#   - Helm 3.x installed and kubectl context set to rancher-desktop
#   - PowerShell 7+ installed (pwsh on macOS/Linux)
#   - Root .env file populated with valid credentials
#   - git available in PATH (for cloning the action-crunchy chart on first run)
#   - On Windows: C:\Program Files\Git\bin must be in PATH (provides sh.exe for Task)
#   - hosts file entry "127.0.0.1 forms-public.localhost" to reach the public portal
#   - The local cluster serves over plain HTTP. The backend chart sets
#     AUTH_COOKIE_SECURE=false in values-local.yaml so the refresh-token
#     cookie works locally; do NOT carry that override to staging/prod.
#
# Usage:
#   cd infra/local && task all          # full pipeline
#   task -d infra/local all             # from repo root
#   task -d infra/local build           # rebuild images only
#   task -d infra/local build:frontend  # rebuild frontend image only
#   task -d infra/local build:migrations # rebuild migrations image only
#   task -d infra/local build:backend         # rebuild backend image only
#   task -d infra/local build:public-frontend  # rebuild public-frontend image only
#   task -d infra/local build:public-backend   # rebuild public-backend image only
#   task -d infra/local deploy:db                 # Deploy db only
#   task -d infra/local deploy                 # redeploy app only
#   task -d infra/local teardown    # Remove app only (keeps database)
#   task -d infra/local teardown:all    # remove everything
# Run rollout if it doesn't get deployed:
# Frontend Rollout: kubectl rollout restart deployment/transportation-forms-local-frontend -n default
# Backend Rollout: kubectl rollout restart deployment/transportation-forms-local-backend -n default
# Public-Backend Rollout: kubectl rollout restart deployment/transportation-forms-local-public-backend -n default
# Public-Frontend Rollout: kubectl rollout restart deployment/transportation-forms-local-public-frontend -n default
# ─────────────────────────────────────────────────────────────────────────────
#
# The pipeline is intentionally kept close to the OpenShift topology while using
# local images, local-path storage, standard Kubernetes Ingress, and reduced
# resource requests.

version: "3"

dotenv: ["../../.env"]

vars:
  TAG: local
  RELEASE_NAME: transportation-forms-local
  CRUNCHY_RELEASE: transportation-forms-local-crunchy
  CHART: infra/charts/app
  CRUNCHY_CACHE: infra/local/.action-crunchy
  CRUNCHY_ACTION_REF: v2.1.0
  PGO_VERSION: 5.8.5
  POWERSHELL: pwsh
  PS_BOILERPLATE: |
    $ErrorActionPreference = "Stop"

    function Invoke-CheckedCommand {
      param([string]$FilePath, [string[]]$Arguments)
      & $FilePath @Arguments
      if ($LASTEXITCODE -ne 0) {
        throw "Command failed ($LASTEXITCODE): $FilePath $($Arguments -join ' ')"
      }
    }

set: [errexit, pipefail]

tasks:
  build:backend:
    desc: Build the backend Docker image
    dir: ../..
    cmds:
      - docker build -f apps/backend/Dockerfile -t ghcr.io/bcgov/transportation-forms/backend:{{.TAG}} .

  build:frontend:
    desc: Build the frontend Docker image
    dir: ../..
    cmds:
      - docker build -f apps/frontend/Dockerfile -t ghcr.io/bcgov/transportation-forms/frontend:{{.TAG}} .

  build:migrations:
    desc: Build the migrations Docker image
    dir: ../..
    cmds:
      - docker build -f apps/backend/migrations/Dockerfile -t ghcr.io/bcgov/transportation-forms/migrations:{{.TAG}} .

  build:public-backend:
    desc: Build the public-backend Docker image
    dir: ../..
    cmds:
      - docker build -f apps/public-backend/Dockerfile -t ghcr.io/bcgov/transportation-forms/public-backend:{{.TAG}} .

  build:public-frontend:
    desc: Build the public-frontend Docker image
    dir: ../..
    cmds:
      - docker build -f apps/public-frontend/Dockerfile -t ghcr.io/bcgov/transportation-forms/public-frontend:{{.TAG}} .

  build:
    desc: Build all Docker images in parallel
    deps:
      - build:backend
      - build:frontend
      - build:migrations
      - build:public-backend
      - build:public-frontend

  deps:charts:
    desc: Build local Helm chart dependencies
    dir: ../..
    cmds:
      - helm dependency build "{{.CHART}}"

  setup:pgo:
    desc: Install or upgrade the Crunchy PGO operator on k3s
    dir: ../..
    cmds:
      - |
        {{.POWERSHELL}} -NoProfile -ExecutionPolicy Bypass -Command '
          {{.PS_BOILERPLATE}}

          Write-Host "==> Installing or upgrading PGO operator..."
          Invoke-CheckedCommand "helm" @(
            "upgrade", "--install", "pgo",
            "oci://registry.developers.crunchydata.com/crunchydata/pgo",
            "--version", "{{.PGO_VERSION}}",
            "-n", "postgres-operator",
            "--create-namespace",
            "--timeout", "120s",
            "--wait"
          )

          Write-Host "==> Waiting for PGO operator deployment..."
          Invoke-CheckedCommand "kubectl" @(
            "wait", "--for=condition=Available", "deployment/pgo",
            "-n", "postgres-operator", "--timeout=120s"
          )
        '

  deploy:db:
    desc: Deploy Crunchy PostgreSQL to k3s
    dir: ../..
    cmds:
      - |
        {{.POWERSHELL}} -NoProfile -ExecutionPolicy Bypass -Command '
          {{.PS_BOILERPLATE}}

          $cachePath = "{{.CRUNCHY_CACHE}}"
          $expectedRef = "{{.CRUNCHY_ACTION_REF}}"
          $shouldClone = $true

          if (Test-Path $cachePath) {
            $currentRef = (& git -C $cachePath describe --tags --exact-match 2>$null)
            if ($LASTEXITCODE -eq 0 -and $currentRef.Trim() -eq $expectedRef) {
              $shouldClone = $false
              Write-Host "==> Using cached action-crunchy chart at $expectedRef."
            } else {
              Write-Host "==> Removing stale action-crunchy cache."
              Remove-Item -Recurse -Force $cachePath
            }
          }

          if ($shouldClone) {
            Write-Host "==> Cloning action-crunchy $expectedRef..."
            Invoke-CheckedCommand "git" @(
              "clone", "--branch", $expectedRef, "--depth", "1",
              "https://github.com/bcgov/action-crunchy.git", $cachePath
            )
          }

          $networkPolicyTemplate = "$cachePath/charts/crunchy/templates/knp.yaml"
          if (Test-Path $networkPolicyTemplate) {
            Remove-Item -Force $networkPolicyTemplate
          }

          $postgresClusterTemplate = "$cachePath/charts/crunchy/templates/postgrescluster.yaml"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $templateContent = [System.IO.File]::ReadAllText($postgresClusterTemplate)
          [System.IO.File]::WriteAllText(
            $postgresClusterTemplate,
            $templateContent.Replace("openshift: true", "openshift: false"),
            $utf8NoBom
          )

          Write-Host "==> Deploying Crunchy PostgreSQL..."
          Invoke-CheckedCommand "helm" @(
            "upgrade", "--install", "{{.CRUNCHY_RELEASE}}",
            "$cachePath/charts/crunchy",
            "-f", "infra/charts/crunchy/values.yml",
            "-f", "infra/local/crunchy-overrides.yaml",
            "--timeout", "5m"
          )

          Write-Host "==> Waiting for Crunchy PostgreSQL primary pod..."
          $primarySelector = "postgres-operator.crunchydata.com/role=master,postgres-operator.crunchydata.com/cluster={{.CRUNCHY_RELEASE}}-crunchy"
          & kubectl wait "--for=condition=Ready" pod -l $primarySelector "--timeout=180s"
          if ($LASTEXITCODE -ne 0) {
            $postgresSelector = "postgres-operator.crunchydata.com/data=postgres,postgres-operator.crunchydata.com/cluster={{.CRUNCHY_RELEASE}}-crunchy"
            Invoke-CheckedCommand "kubectl" @(
              "wait", "--for=condition=Ready", "pod", "-l", $postgresSelector, "--timeout=180s"
            )
          }
        '

  deploy:
    desc: Deploy the application via Helm
    dir: ../..
    deps:
      - deps:charts
    cmds:
      - |
        {{.POWERSHELL}} -NoProfile -ExecutionPolicy Bypass -Command '
          {{.PS_BOILERPLATE}}

          function Get-KubernetesSecretValue {
            param([string]$SecretName, [string]$Key)
            $encodedValue = (& kubectl get secret $SecretName -o "jsonpath={.data.$Key}")
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($encodedValue)) {
              throw "Could not read key $Key from Kubernetes secret $SecretName."
            }
            return [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($encodedValue.Trim()))
          }

          function Write-HelmValueFile {
            param([string]$Name, [string]$Value)
            $path = "infra/local/.tmp/$Name"
            [System.IO.File]::WriteAllText($path, $Value, $script:Utf8NoBom)
            $script:TempFiles += $path
            return $path
          }

          $requiredEnvNames = @(
            "SECRET_KEY",
            "S3_ENDPOINT_URL",
            "S3_ACCESS_KEY",
            "S3_SECRET_KEY",
            "S3_BUCKET",
            "KEYCLOAK_SERVER_URL",
            "KEYCLOAK_REALM",
            "KEYCLOAK_CLIENT_ID",
            "KEYCLOAK_CLIENT_SECRET",
            "KEYCLOAK_REDIRECT_URI",
            "INITIAL_ADMIN_EMAIL"
          )
          $missingEnvNames = @($requiredEnvNames | Where-Object {
            [string]::IsNullOrWhiteSpace([System.Environment]::GetEnvironmentVariable($_))
          })
          if ($missingEnvNames.Count -gt 0) {
            throw "Missing required .env values: $($missingEnvNames -join ', ')"
          }

          Write-Host "==> Extracting DATABASE_URL from Crunchy secret..."
          $crunchySecret = "{{.CRUNCHY_RELEASE}}-crunchy-pguser-app"
          $dbUri = Get-KubernetesSecretValue $crunchySecret "uri"

          $dbUriMatch = [regex]::Match($dbUri, "^(?<scheme>[^:]+://)(?<auth>.+@)(?<hosts>[^/]+)(?<path>/.*)$")
          if (-not $dbUriMatch.Success) {
            throw "Crunchy DATABASE_URL format was not recognized."
          }

          $primaryHost = $dbUriMatch.Groups["hosts"].Value.Split(",")[0]
          if ($primaryHost -notmatch ":\d+$") {
            $primaryHost = $primaryHost + ":5432"
          }
          $primaryDbUri = (
            $dbUriMatch.Groups["scheme"].Value +
            $dbUriMatch.Groups["auth"].Value +
            $primaryHost +
            $dbUriMatch.Groups["path"].Value
          ).Replace(",", "%2C")

          Write-Host "==> Resolving JWT PEM keys..."
          $jwtPrivateKeyPem = [System.Environment]::GetEnvironmentVariable("JWT_PRIVATE_KEY_PEM")
          $jwtPublicKeyPem = [System.Environment]::GetEnvironmentVariable("JWT_PUBLIC_KEY_PEM")
          if ([string]::IsNullOrWhiteSpace($jwtPrivateKeyPem) -or [string]::IsNullOrWhiteSpace($jwtPublicKeyPem)) {
            Write-Host "JWT PEM not in .env; loading from Kubernetes secret pemkeys..."
            $jwtPrivateKeyPem = Get-KubernetesSecretValue "pemkeys" "JWT_PRIVATE_KEY_PEM"
            $jwtPublicKeyPem = Get-KubernetesSecretValue "pemkeys" "JWT_PUBLIC_KEY_PEM"
          }

          if ([string]::IsNullOrWhiteSpace($jwtPrivateKeyPem) -or [string]::IsNullOrWhiteSpace($jwtPublicKeyPem)) {
            throw "JWT_PRIVATE_KEY_PEM and JWT_PUBLIC_KEY_PEM must both be populated."
          }

          $tempDir = "infra/local/.tmp"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          $script:TempFiles = @()
          $script:Utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          try {
            $databaseUrlFile = Write-HelmValueFile "database-url.txt" $primaryDbUri
            $secretKeyFile = Write-HelmValueFile "secret-key.txt" ([System.Environment]::GetEnvironmentVariable("SECRET_KEY"))
            $jwtPrivateKeyFile = Write-HelmValueFile "jwt-private-key.pem" $jwtPrivateKeyPem
            $jwtPublicKeyFile = Write-HelmValueFile "jwt-public-key.pem" $jwtPublicKeyPem
            $s3EndpointFile = Write-HelmValueFile "s3-endpoint-url.txt" ([System.Environment]::GetEnvironmentVariable("S3_ENDPOINT_URL"))
            $s3AccessKeyFile = Write-HelmValueFile "s3-access-key.txt" ([System.Environment]::GetEnvironmentVariable("S3_ACCESS_KEY"))
            $s3SecretKeyFile = Write-HelmValueFile "s3-secret-key.txt" ([System.Environment]::GetEnvironmentVariable("S3_SECRET_KEY"))
            $s3BucketFile = Write-HelmValueFile "s3-bucket.txt" ([System.Environment]::GetEnvironmentVariable("S3_BUCKET"))
            $keycloakServerUrlFile = Write-HelmValueFile "keycloak-server-url.txt" ([System.Environment]::GetEnvironmentVariable("KEYCLOAK_SERVER_URL"))
            $keycloakRealmFile = Write-HelmValueFile "keycloak-realm.txt" ([System.Environment]::GetEnvironmentVariable("KEYCLOAK_REALM"))
            $keycloakClientIdFile = Write-HelmValueFile "keycloak-client-id.txt" ([System.Environment]::GetEnvironmentVariable("KEYCLOAK_CLIENT_ID"))
            $keycloakClientSecretFile = Write-HelmValueFile "keycloak-client-secret.txt" ([System.Environment]::GetEnvironmentVariable("KEYCLOAK_CLIENT_SECRET"))
            $keycloakRedirectUriFile = Write-HelmValueFile "keycloak-redirect-uri.txt" ([System.Environment]::GetEnvironmentVariable("KEYCLOAK_REDIRECT_URI"))
            $initialAdminEmailFile = Write-HelmValueFile "initial-admin-email.txt" ([System.Environment]::GetEnvironmentVariable("INITIAL_ADMIN_EMAIL"))
            $publicBaseUrlFile = Write-HelmValueFile "public-base-url.txt" "http://forms-public.localhost"

            Write-Host "==> Deploying application with Helm..."
            Invoke-CheckedCommand "helm" @(
              "upgrade", "--install", "{{.RELEASE_NAME}}", "{{.CHART}}",
              "-f", "{{.CHART}}/values.yaml",
              "-f", "{{.CHART}}/values-local.yaml",
              "--set-string", "backend.image.tag={{.TAG}}",
              "--set-string", "backend.image.migrationsTag={{.TAG}}",
              "--set-string", "frontend.image.tag={{.TAG}}",
              "--set-string", "public-backend.image.tag={{.TAG}}",
              "--set-string", "public-frontend.image.tag={{.TAG}}",
              "--set-file", "backend.secrets.databaseUrl=$databaseUrlFile",
              "--set-file", "backend.secrets.secretKey=$secretKeyFile",
              "--set-file", "backend.secrets.jwtPrivateKeyPem=$jwtPrivateKeyFile",
              "--set-file", "backend.secrets.jwtPublicKeyPem=$jwtPublicKeyFile",
              "--set-file", "backend.secrets.s3EndpointUrl=$s3EndpointFile",
              "--set-file", "backend.secrets.s3AccessKey=$s3AccessKeyFile",
              "--set-file", "backend.secrets.s3SecretKey=$s3SecretKeyFile",
              "--set-file", "backend.secrets.s3Bucket=$s3BucketFile",
              "--set-file", "backend.secrets.keycloakServerUrl=$keycloakServerUrlFile",
              "--set-file", "backend.secrets.keycloakRealm=$keycloakRealmFile",
              "--set-file", "backend.secrets.keycloakClientId=$keycloakClientIdFile",
              "--set-file", "backend.secrets.keycloakClientSecret=$keycloakClientSecretFile",
              "--set-file", "backend.secrets.keycloakRedirectUri=$keycloakRedirectUriFile",
              "--set-file", "backend.secrets.initialAdminEmail=$initialAdminEmailFile",
              "--set-file", "public-frontend.s3.internalUpstream=$s3EndpointFile",
              "--set-file", "public-frontend.publicBaseUrl=$publicBaseUrlFile",
              "--set-file", "public-backend.publicBaseUrl=$publicBaseUrlFile",
              "--set-string", "public-backend.resources.app.limits.memory=512Mi",
              "--set-string", "public-frontend.resources.limits.memory=512Mi",
              "--timeout", "10m"
            )
          } finally {
            foreach ($tempFile in $script:TempFiles) {
              Remove-Item -Force -ErrorAction SilentlyContinue $tempFile
            }
          }
        '
      - |
        {{.POWERSHELL}} -NoProfile -ExecutionPolicy Bypass -Command '
          {{.PS_BOILERPLATE}}

          $deployments = @(
            "{{.RELEASE_NAME}}-backend",
            "{{.RELEASE_NAME}}-frontend",
            "{{.RELEASE_NAME}}-public-backend",
            "{{.RELEASE_NAME}}-public-frontend"
          )

          Write-Host "==> Restarting deployments to pick up local image changes..."
          foreach ($deployment in $deployments) {
            Invoke-CheckedCommand "kubectl" @("rollout", "restart", "deployment/$deployment")
          }

          Write-Host "==> Waiting for rollouts to complete..."
          foreach ($deployment in $deployments) {
            Invoke-CheckedCommand "kubectl" @("rollout", "status", "deployment/$deployment", "--timeout=300s")
          }
        '
      - |
        {{.POWERSHELL}} -NoProfile -ExecutionPolicy Bypass -Command '
          $ErrorActionPreference = "Stop"
          kubectl apply -f infra/local/ingress.yaml
          if ($LASTEXITCODE -ne 0) {
            throw "Command failed ($LASTEXITCODE): kubectl apply -f infra/local/ingress.yaml"
          }
          Write-Host "Deployment complete."
          Write-Host "Internal app:  http://localhost/"
          Write-Host "Public portal: http://forms-public.localhost/"
        '

  all:
    desc: "Full pipeline: setup PGO, build images, deploy DB, deploy app"
    cmds:
      - task: setup:pgo
      - task: _build-and-db
      - task: deploy

  _build-and-db:
    internal: true
    deps:
      - build
      - deploy:db

  teardown:
    desc: Uninstall the application Helm release and keep the database
    dir: ../..
    cmds:
      - kubectl delete -f infra/local/ingress.yaml --ignore-not-found
      - cmd: helm uninstall {{.RELEASE_NAME}}
        ignore_error: true

  teardown:all:
    desc: Uninstall the application and Crunchy PostgreSQL releases
    dir: ../..
    cmds:
      - kubectl delete -f infra/local/ingress.yaml --ignore-not-found
      - cmd: helm uninstall {{.RELEASE_NAME}}
        ignore_error: true
      - cmd: helm uninstall {{.CRUNCHY_RELEASE}}
        ignore_error: true
