# ── Local Deployment Taskfile ─────────────────────────────────────────────────
#
# Mirrors the GitHub CI/CD pipeline (.github/workflows/dev.yml and
# .github/workflows/.deployer.yml) for local development on Rancher Desktop (k3s).
#
# Install:
#   brew install go-task        (macOS / Linux)
#   winget install Task.Task    (Windows)
#
# Prerequisites:
#   - Rancher Desktop installed with dockerd (moby) engine (not containerd)
#   - Helm 3.x installed and kubectl context set to rancher-desktop
#   - Root .env file populated with valid credentials (S3_*, KEYCLOAK_*, SECRET_KEY,
#     INITIAL_ADMIN_EMAIL — all pointing to datacenter services, NOT local containers)
#   - git available in PATH (for cloning the action-crunchy chart on first run)
#   - On Windows: C:\Program Files\Git\bin must be in PATH (provides sh.exe for Task)
#
# Usage:
#   cd infra/local && task all          # full pipeline
#   task -d infra/local all             # from repo root
#   task -d infra/local build           # rebuild images only
#   task -d infra/local build:frontend  # rebuild frontend image only
#   task -d infra/local build:migrations # rebuild migrations image only
#   task -d infra/local build:backend         # rebuild backend image only
#   task -d infra/local build:public-frontend  # rebuild public-frontend image only
#   task -d infra/local build:public-backend   # rebuild public-backend image only
#   task -d infra/local deploy:db                 # Deploy db only
#   task -d infra/local deploy                 # redeploy app only
#   task -d infra/local teardown    # Remove app only (keeps database)
#   task -d infra/local teardown:all    # remove everything
# Run rollout if it doesn't get deployed:
# Frontend Rollout: kubectl rollout restart deployment/transportation-forms-local-frontend -n default
# Backend Rollout: kubectl rollout restart deployment/transportation-forms-local-backend -n default
# Public-Backend Rollout: kubectl rollout restart deployment/transportation-forms-local-public-backend -n default
# Public-Frontend Rollout: kubectl rollout restart deployment/transportation-forms-local-public-frontend -n default
# ─────────────────────────────────────────────────────────────────────────────

version: "3"

dotenv: ["../../.env"]

vars:
  TAG: local
  ENV: local
  RELEASE_NAME: transportation-forms-local
  CRUNCHY_RELEASE: transportation-forms-local-crunchy
  CHART: infra/charts/app
  CRUNCHY_CACHE: infra/local/.action-crunchy

set: [errexit, pipefail]

tasks:
  # ── Build tasks (mirror the builds matrix job in dev.yml) ──────────────────

  build:backend:
    desc: Build the backend Docker image (tagged local)
    dir: ../..
    cmds:
      - docker build -f apps/backend/Dockerfile -t ghcr.io/bcgov/transportation-forms/backend:{{.TAG}} .

  build:frontend:
    desc: Build the frontend Docker image (tagged local)
    dir: ../..
    cmds:
      - docker build -f apps/frontend/Dockerfile -t ghcr.io/bcgov/transportation-forms/frontend:{{.TAG}} .

  build:migrations:
    desc: Build the migrations Docker image (tagged local)
    dir: ../..
    cmds:
      - docker build -f apps/backend/migrations/Dockerfile -t ghcr.io/bcgov/transportation-forms/migrations:{{.TAG}} .

  build:public-backend:
    desc: Build the public-backend Docker image (tagged local)
    dir: ../..
    cmds:
      - docker build -f apps/public-backend/Dockerfile -t ghcr.io/bcgov/transportation-forms/public-backend:{{.TAG}} .

  build:public-frontend:
    desc: Build the public-frontend Docker image (tagged local)
    dir: ../..
    cmds:
      - docker build -f apps/public-frontend/Dockerfile -t ghcr.io/bcgov/transportation-forms/public-frontend:{{.TAG}} .

  build:
    desc: Build all Docker images in parallel
    deps:
      - build:backend
      - build:frontend
      - build:migrations
      - build:public-backend
      - build:public-frontend

  # ── Database tasks (mirror Crunchy deployment in .deployer.yml) ────────────

  setup:pgo:
    desc: Install the Crunchy PGO operator on k3s (idempotent)
    dir: ../..
    cmds:
      - |
        if helm status pgo -n postgres-operator >/dev/null 2>&1; then
          echo "PGO operator already installed — skipping."
        else
          echo "Installing PGO operator via Helm OCI chart..."
          kubectl create namespace postgres-operator --dry-run=client -o yaml | kubectl apply -f -
          helm install pgo \
            oci://registry.developers.crunchydata.com/crunchydata/pgo \
            --version 5.8.5 \
            -n postgres-operator \
            --timeout 120s \
            --wait
        fi
      - |
        echo "Waiting for PGO operator to become ready..."
        kubectl wait --for=condition=Available deployment/pgo \
          -n postgres-operator --timeout=120s

  deploy:db:
    desc: Deploy Crunchy PostgreSQL to k3s (mirrors .deployer.yml)
    dir: ../..
    cmds:
      # Clone bcgov/action-crunchy repo (cached) if not already present
      - |
        if [ ! -d "{{.CRUNCHY_CACHE}}" ]; then
          echo "Cloning bcgov/action-crunchy v2.0.0..."
          git clone --branch v2.0.0 --depth 1 \
            https://github.com/bcgov/action-crunchy.git "{{.CRUNCHY_CACHE}}"
        else
          echo "Using cached action-crunchy chart."
        fi
      # Fix for K3s: The action-crunchy chart includes a strict NetworkPolicy that blocks
      # cross-namespace or pod-to-pod communication. We remove it locally.
      - rm -f "{{.CRUNCHY_CACHE}}/charts/crunchy/templates/knp.yaml"
      # Fix openshift flag locally on the chart itself instead of patching via kubectl.
      # This avoids Server-Side Apply conflicts upon redeployment on local k3s.
      - |
        powershell -Command "(Get-Content -Path '{{.CRUNCHY_CACHE}}/charts/crunchy/templates/postgrescluster.yaml') -replace 'openshift: true', 'openshift: false' | Set-Content -Path '{{.CRUNCHY_CACHE}}/charts/crunchy/templates/postgrescluster.yaml'"
      # Deploy Crunchy using the action's chart + project values + local overrides
      - |
        helm upgrade --install "{{.CRUNCHY_RELEASE}}" \
          "{{.CRUNCHY_CACHE}}/charts/crunchy" \
          -f infra/charts/crunchy/values.yml \
          -f infra/local/crunchy-overrides.yaml \
          --timeout 5m
      # Wait for the PostgresCluster primary to become ready
      - |
        echo "Waiting for Crunchy PostgreSQL primary to become ready..."
        kubectl wait --for=condition=Ready pod \
          -l postgres-operator.crunchydata.com/role=master,postgres-operator.crunchydata.com/cluster={{.CRUNCHY_RELEASE}}-crunchy \
          --timeout=180s 2>/dev/null || \
        kubectl wait --for=condition=Ready pod \
          -l postgres-operator.crunchydata.com/data=postgres,postgres-operator.crunchydata.com/cluster={{.CRUNCHY_RELEASE}}-crunchy \
          --timeout=180s

  # ── App deploy task (mirrors helm upgrade/install in .deployer.yml) ────────

  deploy:
    desc: Deploy the application via Helm (mirrors .deployer.yml)
    dir: ../..
    cmds:
      - |
        # Extract the pre-built DATABASE_URL (uri) directly from Crunchy-generated secret.
        CRUNCHY_SECRET="{{.CRUNCHY_RELEASE}}-crunchy-pguser-app"
        DB_URI=$(kubectl get secret "$CRUNCHY_SECRET" -o jsonpath="{.data.uri}" | base64 -d)

        if [ -z "$DB_URI" ]; then
          echo "ERROR: Could not extract DATABASE_URL (uri) from Crunchy secret."
          echo "Ensure deploy:db has completed successfully."
          exit 1
        fi

        # Extract only the primary host from the HA DB_URI to avoid SQLAlchemy parsing issues
        # Also URL-encode any remaining commas (like in the password) as %2C to prevent Helm's --set-string from splitting it
        PRIMARY_DB_URI=$(powershell -Command "\$u='$DB_URI'; \$parts=\$u.Split('@'); \$auth=\$parts[0]; \$tail=\$parts[1]; \$hosts=\$tail.Split('/')[0]; \$db=\$tail.Substring(\$hosts.Length); \$primary=\$hosts.Split(',')[0]; if (\$primary.IndexOf(':') -lt 0) { \$primary += ':5432' }; [Console]::Out.Write((\$auth + '@' + \$primary + \$db).Replace(',', '%2C'))")

        echo "Deploying application with Helm..."
        helm upgrade --install "{{.RELEASE_NAME}}" "{{.CHART}}" \
          -f "{{.CHART}}/values.yaml" \
          -f "{{.CHART}}/values-local.yaml" \
          --set-string global.tag="{{.TAG}}" \
          --set-string backend.secrets.databaseUrl="${PRIMARY_DB_URI}" \
          --set backend.secrets.secretKey="${SECRET_KEY}" \
          --set backend.secrets.s3EndpointUrl="${S3_ENDPOINT_URL}" \
          --set backend.secrets.s3AccessKey="${S3_ACCESS_KEY}" \
          --set backend.secrets.s3SecretKey="${S3_SECRET_KEY}" \
          --set backend.secrets.s3Bucket="${S3_BUCKET}" \
          --set backend.secrets.keycloakServerUrl="${KEYCLOAK_SERVER_URL}" \
          --set backend.secrets.keycloakRealm="${KEYCLOAK_REALM}" \
          --set backend.secrets.keycloakClientId="${KEYCLOAK_CLIENT_ID}" \
          --set backend.secrets.keycloakClientSecret="${KEYCLOAK_CLIENT_SECRET}" \
          --set backend.secrets.keycloakRedirectUri="${KEYCLOAK_REDIRECT_URI}" \
          --set backend.secrets.initialAdminEmail="${INITIAL_ADMIN_EMAIL}" \
          --set "public-frontend.s3.internalUpstream=${S3_ENDPOINT_URL}" \
          --set "public-frontend.publicBaseUrl=http://forms-public.localhost" \
          --set "public-backend.publicBaseUrl=http://forms-public.localhost" \
          --set "public-backend.resources.app.limits.memory=512Mi" \
          --set "public-frontend.resources.limits.memory=512Mi" \
          --timeout 10m \
          --wait

      # The Helm chart templates lack an ingress definition, so we apply one manually
      # to expose the frontend and backend locally on Rancher Desktop's default port 80.
      - |
        echo "Applying local ingress..."
        kubectl apply -f infra/local/ingress.yaml

  # ── Orchestration tasks ────────────────────────────────────────────────────

  all:
    desc: "Full pipeline: setup PGO → build + deploy DB → deploy app"
    cmds:
      - task: setup:pgo
      - task: _build-and-db
      - task: deploy

  _build-and-db:
    internal: true
    deps:
      - build
      - deploy:db

  teardown:
    desc: Uninstall the application Helm release (keeps database)
    dir: ../..
    cmds:
      - kubectl delete -f infra/local/ingress.yaml --ignore-not-found || true
      - helm uninstall {{.RELEASE_NAME}} || true

  teardown:all:
    desc: Uninstall both the application and Crunchy PostgreSQL releases
    dir: ../..
    cmds:
      - kubectl delete -f infra/local/ingress.yaml --ignore-not-found || true
      - helm uninstall {{.RELEASE_NAME}} || true
      - helm uninstall {{.CRUNCHY_RELEASE}} || true
