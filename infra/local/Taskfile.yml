# Local Deployment Taskfile
#
# Install:
#   brew install go-task        (macOS / Linux)
#   winget install Task.Task    (Windows)
#
# Prerequisites:
#   - Rancher Desktop installed with dockerd (moby) engine (not containerd)
#   - Helm 3.x installed and kubectl context set to rancher-desktop
#   - PowerShell 7+ installed (pwsh on macOS/Linux)
#   - Root .env file populated with valid credentials
#   - git available in PATH (for cloning the action-crunchy chart on first run)
#   - On Windows: C:\Program Files\Git\bin must be in PATH (provides sh.exe for Task)
#   - hosts file entry "127.0.0.1 forms-public.localhost" to reach the public portal
#   - The local cluster serves over plain HTTP. The backend chart sets
#     AUTH_COOKIE_SECURE=false in values-local.yaml so the refresh-token
#     cookie works locally; do NOT carry that override to staging/prod.
#
# Usage:
#   cd infra/local && task all          # full pipeline
#   task -d infra/local all             # from repo root
#   task -d infra/local build           # rebuild images only
#   task -d infra/local build:frontend  # rebuild frontend image only
#   task -d infra/local build:migrations # rebuild migrations image only
#   task -d infra/local build:backend         # rebuild backend image only
#   task -d infra/local build:public-frontend  # rebuild public-frontend image only
#   task -d infra/local build:public-backend   # rebuild public-backend image only
#   task -d infra/local deploy:db                 # Deploy db only
#   task -d infra/local deploy                 # redeploy app only
#   task -d infra/local teardown    # Remove app only (keeps database)
#   task -d infra/local teardown:all    # remove everything
# Run rollout if it doesn't get deployed:
# Frontend Rollout: kubectl rollout restart deployment/transportation-forms-local-frontend -n default
# Backend Rollout: kubectl rollout restart deployment/transportation-forms-local-backend -n default
# Public-Backend Rollout: kubectl rollout restart deployment/transportation-forms-local-public-backend -n default
# Public-Frontend Rollout: kubectl rollout restart deployment/transportation-forms-local-public-frontend -n default
# ─────────────────────────────────────────────────────────────────────────────
#
# The pipeline is intentionally kept close to the OpenShift topology while using
# local images, local-path storage, standard Kubernetes Ingress, and reduced
# resource requests.

version: "3"

dotenv: ["../../.env"]

vars:
  TAG: local
  RELEASE_NAME: transportation-forms-local
  CRUNCHY_RELEASE: transportation-forms-local-crunchy
  CHART: infra/charts/app
  CRUNCHY_CACHE: infra/local/.action-crunchy
  CRUNCHY_ACTION_REF: v2.1.0
  PGO_VERSION: 5.8.5
  POWERSHELL: pwsh

set: [errexit, pipefail]

tasks:
  build:backend:
    desc: Build the backend Docker image
    dir: ../..
    cmds:
      - docker build -f apps/backend/Dockerfile -t ghcr.io/bcgov/transportation-forms/backend:{{.TAG}} .

  build:frontend:
    desc: Build the frontend Docker image
    dir: ../..
    cmds:
      - docker build -f apps/frontend/Dockerfile -t ghcr.io/bcgov/transportation-forms/frontend:{{.TAG}} .

  build:migrations:
    desc: Build the migrations Docker image
    dir: ../..
    cmds:
      - docker build -f apps/backend/migrations/Dockerfile -t ghcr.io/bcgov/transportation-forms/migrations:{{.TAG}} .

  build:public-backend:
    desc: Build the public-backend Docker image
    dir: ../..
    cmds:
      - docker build -f apps/public-backend/Dockerfile -t ghcr.io/bcgov/transportation-forms/public-backend:{{.TAG}} .

  build:public-frontend:
    desc: Build the public-frontend Docker image
    dir: ../..
    cmds:
      - docker build -f apps/public-frontend/Dockerfile -t ghcr.io/bcgov/transportation-forms/public-frontend:{{.TAG}} .

  build:
    desc: Build all Docker images in parallel
    deps:
      - build:backend
      - build:frontend
      - build:migrations
      - build:public-backend
      - build:public-frontend

  deps:charts:
    desc: Build local Helm chart dependencies (repackages file:// subcharts from current source)
    dir: ../..
    cmds:
      # All subcharts are file:// deps. Their tgz's are NOT regenerated by
      # `helm dependency build` unless the version bumps, so any in-place edit
      # to a subchart (templates, files/, values) silently keeps rendering the
      # stale cached tgz. Purge the cache and Chart.lock so `helm dependency
      # build` re-packages every subchart from the current source tree.
      - '{{.POWERSHELL}} -NoProfile -Command "Get-ChildItem -Path ''{{.CHART}}/charts/*.tgz'', ''{{.CHART}}/Chart.lock'' -ErrorAction SilentlyContinue | Remove-Item -Force; exit 0"'
      - helm dependency build "{{.CHART}}"

  setup:pgo:
    desc: Install or upgrade the Crunchy PGO operator on k3s
    dir: ../..
    cmds:
      - '{{.POWERSHELL}} -NoProfile -ExecutionPolicy Bypass -File infra/local/setup-pgo.ps1 -PgoVersion "{{.PGO_VERSION}}"'

  deploy:db:
    desc: Deploy Crunchy PostgreSQL to k3s
    dir: ../..
    cmds:
      - '{{.POWERSHELL}} -NoProfile -ExecutionPolicy Bypass -File infra/local/deploy-db.ps1 -CachePath "{{.CRUNCHY_CACHE}}" -ExpectedRef "{{.CRUNCHY_ACTION_REF}}" -ReleaseName "{{.CRUNCHY_RELEASE}}"'

  deploy:
    desc: Deploy the application via Helm
    dir: ../..
    deps:
      - deps:charts
    cmds:
      - '{{.POWERSHELL}} -NoProfile -ExecutionPolicy Bypass -File infra/local/deploy.ps1 -ReleaseName "{{.RELEASE_NAME}}" -Chart "{{.CHART}}" -Tag "{{.TAG}}" -CrunchyRelease "{{.CRUNCHY_RELEASE}}"'

  all:
    desc: "Full pipeline: setup PGO, build images, deploy DB, deploy app"
    cmds:
      - task: setup:pgo
      - task: _build-and-db
      - task: deploy

  _build-and-db:
    internal: true
    deps:
      - build
      - deploy:db

  teardown:
    desc: Uninstall the application Helm release and keep the database
    dir: ../..
    cmds:
      - kubectl delete -f infra/local/ingress.yaml --ignore-not-found
      - cmd: helm uninstall {{.RELEASE_NAME}}
        ignore_error: true

  teardown:all:
    desc: Uninstall the application and Crunchy PostgreSQL releases
    dir: ../..
    cmds:
      - kubectl delete -f infra/local/ingress.yaml --ignore-not-found
      - cmd: helm uninstall {{.RELEASE_NAME}}
        ignore_error: true
      - cmd: helm uninstall {{.CRUNCHY_RELEASE}}
        ignore_error: true
