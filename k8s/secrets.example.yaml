# Kubernetes Secret template for Transportation Forms
# ----------------------------------------------------------
# 1. Copy this file:   cp k8s/secrets.example.yaml k8s/secrets.yaml
# 2. Replace every <base64-...> placeholder with the actual base64-encoded value.
#    Encode on Linux/macOS:  echo -n "your-value" | base64
#    Encode on Windows:      [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("your-value"))
# 3. Apply:  kubectl apply -f k8s/secrets.yaml
#
# k8s/secrets.yaml is gitignored — never commit it.
---
apiVersion: v1
kind: Secret
metadata:
  name: transportation-forms-secrets
  namespace: transportation-forms
type: Opaque
data:
  # echo -n "your-postgres-password" | base64
  postgres-password: <base64-encoded-postgres-password>

  # Full connection string:
  # echo -n "postgresql://transportation:your-password@transportation-forms-db:5432/transportation_forms" | base64
  database-url: <base64-encoded-database-url>

  # echo -n "your-minio-root-user" | base64
  minio-root-user: <base64-encoded-minio-root-user>

  # echo -n "your-minio-root-password" | base64
  minio-root-password: <base64-encoded-minio-root-password>

  # Keycloak OIDC settings (required for staff sign-in)
  # echo -n "https://your-keycloak-host/auth" | base64
  keycloak-server-url: <base64-encoded-keycloak-server-url>

  # echo -n "your-realm" | base64
  keycloak-realm: <base64-encoded-keycloak-realm>

  # echo -n "your-client-id" | base64
  keycloak-client-id: <base64-encoded-keycloak-client-id>

  # echo -n "your-client-secret" | base64
  keycloak-client-secret: <base64-encoded-keycloak-client-secret>

  # echo -n "http://localhost:8000/api/v1/auth/callback" | base64
  keycloak-redirect-uri: <base64-encoded-keycloak-redirect-uri>
